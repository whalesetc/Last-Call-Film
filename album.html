<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Foto • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <!-- JSZip untuk fitur Unduh ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { --bg-dark: #12110f; --border: rgba(255,255,255,0.1); --accent: #6ee7b7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-dark); color: #fff; min-height: 100vh; padding: 20px; }
        
        .header { max-width: 1200px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .btn-action { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid var(--border); }
        
        .gallery-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .photo-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; aspect-ratio: 9 / 16; position: relative; cursor: pointer; transition: transform 0.2s; }
        .photo-card:hover { transform: scale(1.02); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .empty-state { text-align: center; color: #888; grid-column: 1 / -1; padding: 60px 0; }
        
        /* Modal Lightbox */
        #lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        #lightbox img { max-width: 100%; max-height: 85vh; border-radius: 10px; }
        .close-btn { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 id="eventTitleAlbum">Album Foto Acara</h1>
            <p style="color: #aaa; font-size: 0.85rem; margin-top: 4px;">Koleksi kenangan autentik dari para tamu.</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-action btn-outline" onclick="history.back()">← Kembali</button>
            <button class="btn-action" id="btnDownloadZip" onclick="unduhZipAlbum()">Unduh Semua (.zip)</button>
        </div>
    </div>

    <div class="gallery-grid" id="photoGallery">
        <div class="empty-state">Memuat foto...</div>
    </div>

    <div id="lightbox" onclick="tutupLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        let fotoDataList = [];

        async function muatAlbum() {
            if (!eventId) { alert("ID Acara tidak valid."); return; }

            try {
                // Ambil info nama acara
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (eventDoc.exists) {
                    document.getElementById('eventTitleAlbum').innerText = "Album • " + eventDoc.data().eventName;
                }

                // Ambil foto-foto dari Firestore
                const snapshot = await db.collection('photos')
                    .where('eventId', '==', eventId)
                    .orderBy('createdTime', 'desc')
                    .get();

                const gallery = document.getElementById('photoGallery');
                gallery.innerHTML = '';

                if (snapshot.empty) {
                    gallery.innerHTML = '<div class="empty-state">Belum ada foto yang diunggah ke album ini.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    fotoDataList.push(data.url);
                    
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `<img src="${data.url}" loading="lazy" alt="Foto Tamu">`;
                    card.onclick = () => bukaLightbox(data.url);
                    gallery.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('photoGallery').innerHTML = '<div class="empty-state">Gagal memuat galeri foto.</div>';
            }
        }

        function bukaLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function tutupLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        async function unduhZipAlbum() {
            if (fotoDataList.length === 0) { alert("Tidak ada foto untuk diunduh."); return; }
            
            const btn = document.getElementById('btnDownloadZip');
            btn.innerText = "Menyiapkan ZIP...";
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("TheLastCall_Album");

            fotoDataList.forEach((base64Url, index) => {
                const base64Data = base64Url.replace(/^data:image\/jpeg;base64,/, "");
                folder.file(`foto_${index + 1}.jpg`, base64Data, {base64: true});
            });

            zip.generateAsync({type: "blob"}).then(content => {
                saveAs(content, "Album_TheLastCallFilm.zip");
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            }).catch(err => {
                alert("Gagal membuat file ZIP.");
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            });
        }

        muatAlbum();
    </script>
</body>
</html>
