<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Album Foto • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.55); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; padding: 20px 5%; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .title-area h1 { font-size: 2rem; font-family: 'Playfair Display', serif; }
        .title-area p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        .btn-group { display: flex; gap: 10px; }
        .btn { background: transparent; color: #fff; border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .btn:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }
        .btn-success { background: var(--accent); color: #000; border: none; font-weight: 600; }
        .btn-success:hover { opacity: 0.9; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding-bottom: 40px; }
        .photo-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
        .photo-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .photo-img { width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #000; }
        .photo-info { padding: 10px 12px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); }
        .photo-author { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

        .status-msg { text-align: center; color: var(--text-muted); padding: 60px 0; font-size: 1rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1 id="albumTitle">Album • Memuat...</h1>
            <p id="albumSubtitle">Koleksi kenangan autentik dari para tamu.</p>
        </div>
        <div class="btn-group">
            <a href="javascript:history.back()" class="btn">&larr; Kembali</a>
            <button class="btn btn-success" id="btnDownloadZip" onclick="unduhSemuaZip()">Unduh Semua (.zip)</button>
        </div>
    </div>

    <div class="gallery-grid" id="galleryContainer">
        <div class="status-msg">Memuat foto galeri...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        let fotoListGlobal = [];

        // Ambil atau buat ID unik perangkat tamu untuk mengenali foto pribadi mereka
        let guestSessionId = localStorage.getItem('thelastcall_guest_id');
        if (!guestSessionId) {
            guestSessionId = 'guest_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('thelastcall_guest_id', guestSessionId);
        }

        async function muatAlbum() {
            const container = document.getElementById('galleryContainer');
            if (!eventId) {
                container.innerHTML = '<div class="status-msg">ID Acara tidak valid.</div>';
                return;
            }

            try {
                // Ambil data acara untuk cek ownerId dan privacy
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (!eventDoc.exists) {
                    container.innerHTML = '<div class="status-msg">Acara tidak ditemukan.</div>';
                    return;
                }

                const eventData = eventDoc.data();
                document.getElementById('albumTitle').innerText = `Album • ${eventData.eventName}`;

                // Cek apakah user yang login saat ini adalah pemilik acara
                const currentUser = auth.currentUser;
                const isOwner = currentUser && currentUser.uid === eventData.ownerId;
                const isPrivate = eventData.privacy === 'private';

                if (isPrivate && !isOwner) {
                    document.getElementById('albumSubtitle').innerText = "Mode Privat: Anda hanya melihat hasil foto jepretan Anda sendiri.";
                }

                // Ambil semua foto untuk event ini
                const snapshot = await db.collection('photos').where('eventId', '==', eventId).get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div class="status-msg">Belum ada foto yang diunggah di acara ini.</div>';
                    return;
                }

                let allPhotos = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allPhotos.push({
                        id: doc.id,
                        url: data.url,
                        guestName: data.guestName || 'Tamu',
                        guestId: data.guestId || '',
                        createdTime: data.createdTime ? data.createdTime.toDate() : new Date(0)
                    });
                });

                // Terapkan aturan privasi
                if (isPrivate && !isOwner) {
                    // Filter hanya foto milik tamu ini (berdasarkan guestId atau perangkat)
                    fotoListGlobal = allPhotos.filter(f => f.guestId === guestSessionId);
                } else {
                    // Pemilik acara atau album publik bisa melihat semua foto
                    fotoListGlobal = allPhotos;
                }

                // Urutkan dari terbaru ke terlama
                fotoListGlobal.sort((a, b) => b.createdTime - a.createdTime);

                if (fotoListGlobal.length === 0) {
                    container.innerHTML = '<div class="status-msg">Belum ada foto pribadi yang Anda jepret di album ini.</div>';
                    return;
                }

                container.innerHTML = '';
                fotoListGlobal.forEach((foto, index) => {
                    container.innerHTML += `
                        <div class="photo-card">
                            <img src="${foto.url}" class="photo-img">
                            <div class="photo-info">
                                <span class="photo-author" title="${foto.guestName}">${foto.guestName}</span>
                                <span>#${index + 1}</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Gagal memuat galeri foto: ${error.message}</div>`;
            }
        }

        async function unduhSemuaZip() {
            if (fotoListGlobal.length === 0) {
                alert("Belum ada foto untuk diunduh.");
                return;
            }

            const btn = document.getElementById('btnDownloadZip');
            btn.innerText = "Menyiapkan ZIP...";
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("Album_TheLastCallFilm");

            try {
                let count = 0;
                for (let i = 0; i < fotoListGlobal.length; i++) {
                    const foto = fotoListGlobal[i];
                    try {
                        const response = await fetch(foto.url);
                        const blob = await response.blob();
                        const namaFile = `${i + 1}_${foto.guestName.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`;
                        folder.file(namaFile, blob);
                        count++;
                    } catch (e) {
                        console.error("Gagal mengunduh gambar ke zip:", e);
                    }
                }

                if (count === 0) {
                    throw new Error("Tidak ada gambar yang berhasil diunduh.");
                }

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "Album_Foto_Acara.zip");
                alert("Berhasil mengunduh foto dalam format ZIP!");
            } catch (err) {
                alert("Gagal membuat file ZIP: " + err.message);
            } finally {
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            }
        }

        // Tunggu status auth Firebase siap sebelum memuat album agar status owner terdeteksi akurat
        auth.onAuthStateChanged(() => {
            muatAlbum();
        });
    </script>
</body>
</html>
