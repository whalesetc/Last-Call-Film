<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Call Film • Album Acara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.55); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { text-align: center; margin-bottom: 30px; padding-top: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; position: relative; }
        .event-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 5px; }
        .photo-count { color: var(--text-muted); font-size: 0.9rem; }
        .btn-back { position: absolute; top: 20px; left: 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; transition: 0.2s; }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        /* Grid Galeri */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; width: 100%; flex: 1; padding-bottom: 40px; }
        
        .photo-item { width: 100%; aspect-ratio: 3 / 4; background: #1a1917; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; }
        .photo-item:hover { transform: scale(0.98); opacity: 0.85; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }

        .empty-state { text-align: center; grid-column: 1 / -1; padding: 80px 20px; color: var(--text-muted); font-style: italic; font-size: 1rem; }

        /* Modal Preview */
        #previewModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #previewImage { max-width: 100%; max-height: 75vh; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: contain; }
        .preview-actions { display: flex; gap: 15px; width: 100%; max-width: 350px; }
        .btn-close-modal { flex: 1; padding: 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .btn-save-modal { flex: 2; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:history.back()" class="btn-back">&larr; Kembali</a>
        <h1 class="event-title" id="eventNameDisplay">Memuat Album...</h1>
        <p class="photo-count" id="photoCountDisplay">0 Foto Diambil</p>
    </div>

    <div class="gallery-grid" id="galleryContainer">
        <div class="empty-state">Mencari rol film acara...</div>
    </div>

    <!-- Modal Pop-Up Preview Foto -->
    <div id="previewModal">
        <img id="previewImage" src="">
        <div class="preview-actions">
            <button class="btn-close-modal" onclick="tutupPreview()">Tutup</button>
            <button class="btn-save-modal" onclick="unduhFoto()">Simpan Foto</button>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase (Hanya Firestore)
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Mengambil Parameter ID Event dari URL (Contoh: album.html?event=XYZ)
        let eventId = new URLSearchParams(window.location.search).get('event');
        let currentDownloadUrl = "";

        if (!eventId) {
            document.getElementById('eventNameDisplay').innerText = "Acara Tidak Ditemukan";
            document.getElementById('galleryContainer').innerHTML = "<div class='empty-state'>Tautan album tidak valid atau parameter acara hilang.</div>";
        } else {
            muatDataAcara();
            dengarkanFotoRealtime();
        }

        async function muatDataAcara() {
            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (doc.exists) {
                    document.getElementById('eventNameDisplay').innerText = doc.data().eventName;
                } else {
                    document.getElementById('eventNameDisplay').innerText = "Album Tidak Ditemukan";
                }
            } catch (error) {
                console.error("Gagal memuat judul:", error);
                document.getElementById('eventNameDisplay').innerText = "Kesalahan Sistem";
            }
        }

        // Sinkronisasi Real-Time Foto Tamu Menggunakan onSnapshot
        function dengarkanFotoRealtime() {
            db.collection('events').doc(eventId).collection('photos')
              .orderBy('uploadedAt', 'desc')
              .onSnapshot((snapshot) => {
                  const gallery = document.getElementById('galleryContainer');
                  const countDisplay = document.getElementById('photoCountDisplay');
                  
                  if (snapshot.empty) {
                      gallery.innerHTML = "<div class='empty-state'>Belum ada foto yang diambil.<br>Jadilah tamu pertama yang menjepret momen!</div>";
                      countDisplay.innerText = "0 Foto Diambil";
                      return;
                  }

                  countDisplay.innerText = `${snapshot.size} Foto Diambil`;
                  gallery.innerHTML = ""; 

                  snapshot.forEach((doc) => {
                      const data = doc.data();
                      const div = document.createElement('div');
                      div.className = 'photo-item';
                      div.innerHTML = `<img src="${data.url}" alt="Jepretan Tamu" loading="lazy">`;
                      div.onclick = () => bukaPreview(data.url);
                      gallery.appendChild(div);
                  });
              }, (error) => {
                  console.error("Error mengambil foto:", error);
                  document.getElementById('galleryContainer').innerHTML = "<div class='empty-state' style='color:#ef4444;'>Gagal memuat foto. Periksa kembali aturan (Rules) Firestore Anda.</div>";
              });
        }

        function bukaPreview(url) {
            currentDownloadUrl = url;
            document.getElementById('previewImage').src = url;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function tutupPreview() {
            document.getElementById('previewModal').style.display = 'none';
            currentDownloadUrl = "";
        }

        function unduhFoto() {
            if (!currentDownloadUrl) return;
            fetch(currentDownloadUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `TheLastCall_${Date.now()}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(blobUrl);
                    tutupPreview();
                })
                .catch(err => alert("Gagal mengunduh foto."));
        }
    </script>
</body>
</html>
