<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Album Foto • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <!-- Library JSZip & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background-color: #0b0b0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .top-bar { 
            position: sticky; top: 0; left: 0; width: 100%; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; background: rgba(11, 11, 10, 0.85); 
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        .btn-action { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; 
            text-decoration: none; 
        }
        .btn-action:hover { background: rgba(255,255,255,0.2); }
        .btn-action:active { transform: scale(0.95); }
        .btn-refresh { background: rgba(110, 231, 183, 0.15); border-color: rgba(110, 231, 183, 0.4); color: #6ee7b7; }
        .btn-select-mode { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); color: #93c5fd; }

        .header-section { text-align: center; padding: 30px 20px 20px 20px; }
        .event-title { font-size: 2rem; font-weight: 600; margin-bottom: 5px; }
        .photo-count { color: rgba(255,255,255,0.5); font-size: 0.85rem; }

        .selection-panel { display: none; background: rgba(30,30,30,0.95); padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 65px; z-index: 90; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 10px;}
        .selection-panel.active { display: flex; }

        .gallery-container { padding: 15px; flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; }
        .photo-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 12px; 
        }
        @media (min-width: 600px) {
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        }

        .photo-card { 
            aspect-ratio: 9 / 16; background: #1a1a1a; border-radius: 10px; 
            overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); 
            transition: transform 0.2s; cursor: pointer; 
        }
        .photo-card:hover { transform: scale(1.02); }
        .photo-card.selected { border: 3px solid #3b82f6; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-checkbox { position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 5; }
        .selection-active .card-checkbox { display: flex; }
        .photo-card.selected .card-checkbox { background: #3b82f6; border-color: #3b82f6; }
        .photo-card.selected .card-checkbox::after { content: '✓'; color: #fff; font-size: 0.75rem; font-weight: bold; }

        .pending-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(251, 188, 5, 0.85); color: #000; font-size: 0.65rem; font-weight: bold; padding: 3px 7px; border-radius: 10px; backdrop-filter: blur(4px); }

        .btn-delete-owner { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(220, 38, 38, 0.85); color: #fff; 
            border: none; width: 28px; height: 28px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 0.85rem; backdrop-filter: blur(4px);
            transition: 0.2s; z-index: 5;
        }

        .empty-state { text-align: center; color: rgba(255,255,255,0.4); padding: 60px 20px; font-style: italic; }

        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0a; z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .loader { width: 35px; height: 35px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #6ee7b7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-preview { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-preview img { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 1.5rem; cursor: pointer; background: rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        .spin-icon { display: inline-block; transition: transform 0.3s; }
        .spinning { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loader-overlay">
        <div class="loader"></div>
        <p style="color: #888; font-size: 0.85rem;">Memuat Album Foto...</p>
    </div>

    <div class="top-bar">
        <a href="#" id="linkKamera" class="btn-action">&larr; Kamera</a>
        <div style="display: flex; gap: 8px;">
            <button class="btn-action btn-select-mode" id="btnSelectToggle" onclick="toggleSelectMode()">Pilih</button>
            <button class="btn-action btn-refresh" onclick="refreshManual()">
                <span id="refreshIcon" class="spin-icon">🔄</span> Refresh
            </button>
            <button class="btn-action" onclick="unduhSemuaZip()" id="btnZip" style="background: #fff; color: #000; font-weight: 600;">Unduh ZIP</button>
        </div>
    </div>

    <!-- Panel Kontrol Select & Select All -->
    <div class="selection-panel" id="selectionPanel">
        <div style="display: flex; gap: 8px;">
            <button class="btn-action" onclick="selectAll(true)">Pilih Semua</button>
            <button class="btn-action" onclick="selectAll(false)">Batal Pilih</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-action" onclick="unduhTerpilihZip()" style="background: #2563eb; border: none;">Unduh Terpilih</button>
            <button class="btn-action" id="btnDeleteSelected" onclick="hapusTerpilihOwner()" style="background: #dc2626; border: none; display: none;">Hapus Terpilih</button>
            <button class="btn-action" onclick="toggleSelectMode()" style="background: rgba(255,255,255,0.2);">Selesai</button>
        </div>
    </div>

    <div class="header-section">
        <h1 class="event-title font-serif" id="eventNameDisplay">Nama Acara</h1>
        <p class="photo-count" id="photoCountDisplay">0 Foto Diambil</p>
    </div>

    <div class="gallery-container">
        <div class="photo-grid" id="photoGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            Belum ada foto yang masuk.<br><span style="font-size: 0.8rem; opacity: 0.7;">Tekan tombol "Refresh" jika foto baru saja dijepret.</span>
        </div>
    </div>

    <div class="modal-preview" id="imageModal" onclick="tutupModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="" alt="Preview">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        let listFotoGlobal = [];
        let isOwner = false;
        let isUploadingFromAlbum = false;
        let isSelectMode = false;
        let selectedPhotoIds = new Set();

        async function initAlbum() {
            if (!eventId) { alert("Tautan album tidak valid!"); return; }

            const domain = window.location.href.split('?')[0].replace('album.html', '').replace(/\/$/, '');
            document.getElementById('linkKamera').href = `${domain}/camera.html?event=${eventId}`;

            try {
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (eventDoc.exists) {
                    const eventData = eventDoc.data();
                    document.getElementById('eventNameDisplay').innerText = eventData.eventName;

                    auth.onAuthStateChanged(user => {
                        if (user && user.uid === eventData.ownerId) {
                            isOwner = true;
                            document.getElementById('btnDeleteSelected').style.display = 'inline-flex';
                        } else {
                            isOwner = false;
                        }
                        rendernUIGrid();
                    });
                }

                pasangRealtimeListener();
                prosesPendingAntreanLokal();

            } catch (err) {
                console.error("Gagal memuat album:", err);
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function pasangRealtimeListener() {
            db.collection('photos')
                .where('eventId', '==', eventId)
                .onSnapshot(snapshot => {
                    let tempArr = [];
                    snapshot.forEach(doc => {
                        tempArr.push({
                            docId: doc.id,
                            ...doc.data()
                        });
                    });

                    tempArr.sort((a, b) => {
                        let tA = a.createdTime ? a.createdTime.toMillis() : Date.now();
                        let tB = b.createdTime ? b.createdTime.toMillis() : Date.now();
                        return tB - tA;
                    });

                    listFotoGlobal = tempArr;
                    rendernUIGrid();
                    document.getElementById('loadingOverlay').style.display = 'none';
                }, error => {
                    console.error("Error listener:", error);
                    document.getElementById('loadingOverlay').style.display = 'none';
                });
        }

        function rendernUIGrid() {
            const grid = document.getElementById('photoGrid');
            const empty = document.getElementById('emptyState');
            const countDisplay = document.getElementById('photoCountDisplay');

            let pendingLokal = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
            let totalFoto = listFotoGlobal.length + pendingLokal.length;

            grid.innerHTML = '';
            countDisplay.innerText = `${totalFoto} Foto Diambil`;

            if (totalFoto === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';

                // Render Foto Pending Lokal
                pendingLokal.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `photo-card ${selectedPhotoIds.has(item.id) ? 'selected' : ''}`;
                    
                    card.innerHTML = `
                        <div class="card-checkbox"></div>
                        <img src="${item.dataUrl}" alt="Foto Pending">
                        <div class="pending-badge">⏳ Menyimpan...</div>
                    `;

                    card.onclick = () => {
                        if (isSelectMode) {
                            toggleSelectPhoto(item.id, card);
                        } else {
                            bukaModal(item.dataUrl);
                        }
                    };
                    grid.appendChild(card);
                });

                // Render Foto dari Firestore
                listFotoGlobal.forEach(foto => {
                    const card = document.createElement('div');
                    card.className = `photo-card ${selectedPhotoIds.has(foto.docId) ? 'selected' : ''}`;
                    
                    let deleteBtnHTML = '';
                    if (isOwner && !isSelectMode) {
                        deleteBtnHTML = `<button class="btn-delete-owner" onclick="hapusFoto(event, '${foto.docId}')" title="Hapus Foto">🗑️</button>`;
                    }

                    card.innerHTML = `
                        <div class="card-checkbox"></div>
                        <img src="${foto.url}" loading="lazy" alt="Foto">
                        ${deleteBtnHTML}
                    `;
                    
                    card.onclick = () => {
                        if (isSelectMode) {
                            toggleSelectPhoto(foto.docId, card);
                        } else {
                            bukaModal(foto.url);
                        }
                    };

                    grid.appendChild(card);
                });
            }
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const panel = document.getElementById('selectionPanel');
            const btnToggle = document.getElementById('btnSelectToggle');
            const grid = document.getElementById('photoGrid');

            if (isSelectMode) {
                panel.classList.add('active');
                grid.classList.add('selection-active');
                btnToggle.innerText = "Batal Pilih";
                btnToggle.style.background = "rgba(239, 68, 68, 0.2)";
            } else {
                panel.classList.remove('active');
                grid.classList.remove('selection-active');
                btnToggle.innerText = "Pilih";
                btnToggle.style.background = "";
                selectedPhotoIds.clear();
            }
            rendernUIGrid();
        }

        function toggleSelectPhoto(id, cardElement) {
            if (selectedPhotoIds.has(id)) {
                selectedPhotoIds.delete(id);
                cardElement.classList.remove('selected');
            } else {
                selectedPhotoIds.add(id);
                cardElement.classList.add('selected');
            }
        }

        function selectAll(select) {
            selectedPhotoIds.clear();
            if (select) {
                // Masukkan ID dari foto Firestore
                listFotoGlobal.forEach(f => selectedPhotoIds.add(f.docId));
                // Masukkan ID dari foto pending lokal
                let pendingLokal = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
                pendingLokal.forEach(p => selectedPhotoIds.add(p.id));
            }
            rendernUIGrid();
        }

        async function unduhTerpilihZip() {
            if (selectedPhotoIds.size === 0) {
                alert("Belum ada foto yang dipilih.");
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder("TheLastCall_Terpilih");
            let count = 0;

            for (let id of selectedPhotoIds) {
                let fotoObj = listFotoGlobal.find(f => f.docId === id);
                let imageUrl = '';

                if (fotoObj) {
                    imageUrl = fotoObj.url;
                } else {
                    let pendingLokal = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
                    let pendingObj = pendingLokal.find(p => p.id === id);
                    if (pendingObj) imageUrl = pendingObj.dataUrl;
                }

                if (imageUrl) {
                    try {
                        const response = await fetch(imageUrl);
                        const blob = await response.blob();
                        folder.file(`Foto_${++count}.jpg`, blob);
                    } catch(e) {}
                }
            }

            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, `Album_Terpilih_${eventId}.zip`);
        }

        async function hapusTerpilihOwner() {
            if (!isOwner || selectedPhotoIds.size === 0) return;

            if (confirm(`Hapus ${selectedPhotoIds.size} foto yang dipilih secara permanen?`)) {
                try {
                    const batch = db.batch();
                    let hasFirestoreDelete = false;

                    selectedPhotoIds.forEach(id => {
                        if (!id.startsWith('p_')) {
                            const ref = db.collection('photos').doc(id);
                            batch.delete(ref);
                            hasFirestoreDelete = true;
                        }
                    });

                    if (hasFirestoreDelete) {
                        await batch.commit();
                    }

                    selectedPhotoIds.clear();
                    toggleSelectMode();
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            }
        }

        async function prosesPendingAntreanLokal() {
            if (isUploadingFromAlbum) return;

            let pending = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
            if (pending.length === 0) return;

            isUploadingFromAlbum = true;
            let item = pending[0];

            try {
                const base64Data = item.dataUrl.split(',')[1];
                const formData = new FormData();
                formData.append('image', base64Data);

                const uploadRes = await fetch('https://api.imgbb.com/1/upload?key=16a4714fa54ed030ef5416ae07a05f68', {
                    method: 'POST', body: formData
                });
                const uploadData = await uploadRes.json();

                if (uploadData && uploadData.success) {
                    await db.collection('photos').add({
                        eventId: eventId,
                        guestId: item.guestId,
                        url: uploadData.data.url,
                        createdTime: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    let currentPending = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
                    currentPending = currentPending.filter(p => p.id !== item.id);
                    localStorage.setItem(`pending_${eventId}`, JSON.stringify(currentPending));
                    rendernUIGrid();
                }
            } catch (err) {
                await new Promise(r => setTimeout(r, 2000));
            } finally {
                isUploadingFromAlbum = false;
                let remaining = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
                if (remaining.length > 0) {
                    prosesPendingAntreanLokal();
                }
            }
        }

        async function hapusFoto(e, docId) {
            e.stopPropagation();
            if (!isOwner) return;

            if (confirm("Apakah Anda yakin ingin menghapus foto ini secara permanen dari album?")) {
                try {
                    await db.collection('photos').doc(docId).delete();
                } catch (err) {
                    alert("Gagal menghapus foto: " + err.message);
                }
            }
        }

        async function refreshManual() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('spinning');
            
            prosesPendingAntreanLokal();

            try {
                const snapshot = await db.collection('photos')
                    .where('eventId', '==', eventId)
                    .get();

                let tempArr = [];
                snapshot.forEach(doc => tempArr.push({ docId: doc.id, ...doc.data() }));

                tempArr.sort((a, b) => {
                    let tA = a.createdTime ? a.createdTime.toMillis() : Date.now();
                    let tB = b.createdTime ? b.createdTime.toMillis() : Date.now();
                    return tB - tA;
                });

                listFotoGlobal = tempArr;
                rendernUIGrid();
            } catch (err) {
                console.error("Gagal refresh:", err);
            } finally {
                setTimeout(() => icon.classList.remove('spinning'), 500);
            }
        }

        function bukaModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function tutupModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        async function unduhSemuaZip() {
            let pendingLokal = JSON.parse(localStorage.getItem(`pending_${eventId}`)) || [];
            if (listFotoGlobal.length === 0 && pendingLokal.length === 0) {
                alert("Belum ada foto yang bisa diunduh.");
                return;
            }

            const btnZip = document.getElementById('btnZip');
            btnZip.innerText = "Menyiapkan ZIP...";
            btnZip.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("TheLastCall_Photos");
            let total = 0;

            try {
                for (let f of listFotoGlobal) {
                    const response = await fetch(f.url);
                    const blob = await response.blob();
                    folder.file(`Foto_${++total}.jpg`, blob);
                }
                for (let p of pendingLokal) {
                    const response = await fetch(p.dataUrl);
                    const blob = await response.blob();
                    folder.file(`Foto_${++total}.jpg`, blob);
                }

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `Album_Foto_${eventId}.zip`);
            } catch (err) {
                alert("Gagal mengunduh ZIP: " + err.message);
            } finally {
                btnZip.innerText = "Unduh ZIP";
                btnZip.disabled = false;
            }
        }

        initAlbum();
    </script>
</body>
</html>
