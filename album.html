<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Album Foto • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { 
            --bg-dark: #261C17; 
            --card-bg: #322520;
            --text-light: #E5D178; 
            --text-muted: rgba(229, 209, 120, 0.65); 
            --accent: #D9874F; 
            --secondary-accent: #638073; 
            --mahogany: #6B3D36; 
            --border-color: rgba(107, 61, 54, 0.5); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        .font-serif { font-family: 'Playfair Display', serif; }

        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(38,28,23,0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 15px; }
        .album-title-group h1 { font-size: 1.6rem; color: var(--text-light); font-weight: 700; }
        .album-title-group p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .btn-custom { background: transparent; color: var(--text-light); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-custom:hover { background: rgba(107,61,54,0.3); border-color: var(--accent); }
        
        .btn-primary-custom { background: var(--accent); color: #261C17; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary-custom:hover { background: #e09867; }

        .btn-select-mode { background: var(--secondary-accent); color: #fff; border: none; }
        .btn-select-mode.active { background: #4a6358; border: 1px solid var(--text-light); }

        .main-container { padding: 30px 5%; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        
        .photo-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; flex-direction: column; transition: 0.2s; position: relative; cursor: pointer; }
        .photo-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .photo-wrapper { width: 100%; aspect-ratio: 3/4; background: #1a120e; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .photo-checkbox { position: absolute; top: 10px; left: 10px; width: 24px; height: 24px; accent-color: var(--accent); cursor: pointer; z-index: 10; display: none; pointer-events: none; }
        .gallery-grid.selecting .photo-checkbox { display: block; }
        .photo-card.selected { border: 2.5px solid var(--accent); background: rgba(217, 135, 79, 0.15); }

        .photo-footer { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(38,28,23,0.9); border-top: 1px solid var(--border-color); }
        .guest-tag { font-size: 0.8rem; font-weight: 600; color: var(--text-light); }
        .time-tag { font-size: 0.7rem; color: var(--text-muted); }

        /* Modal Preview Foto Penuh (Lightbox) */
        .lightbox-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 9999; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(6px); }
        .lightbox-modal.show { display: flex; }
        .lightbox-content { max-width: 520px; width: 100%; max-height: 92vh; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.85); position: relative; }
        .lightbox-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(38,28,23,0.95); border-bottom: 1px solid var(--border-color); }
        .lightbox-close { background: transparent; border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; padding: 5px 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .lightbox-close:hover { background: rgba(107,61,54,0.4); border-color: var(--accent); }
        .lightbox-img-wrap { width: 100%; max-height: 75vh; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .lightbox-img-wrap img { max-width: 100%; max-height: 75vh; object-fit: contain; }
        .lightbox-caption { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(38,28,23,0.95); border-top: 1px solid var(--border-color); font-size: 0.85rem; }

        .filter-original { filter: none; }
        .filter-ultramax { filter: contrast(1.1) saturate(1.2) brightness(1.05) sepia(0.15); }
        .filter-fuji { filter: contrast(1.15) saturate(1.1) hue-rotate(-10deg); }
        .filter-gold { filter: sepia(0.25) contrast(1.05) brightness(1.1) saturate(1.1); }
        .filter-agfa { filter: saturate(1.3) contrast(1.1) hue-rotate(5deg); }
        .filter-portra { filter: brightness(1.1) contrast(0.95) saturate(0.9) sepia(0.1); }
        .filter-flash { filter: contrast(1.35) brightness(1.15) saturate(1.2); }
        .filter-vintage90 { filter: sepia(0.4) contrast(1.1) brightness(0.95); }
        .filter-cinematic { filter: contrast(1.2) saturate(0.8) hue-rotate(180deg) brightness(0.95); }
        .filter-mono { filter: grayscale(100%) contrast(1.2); }

        @media(max-width: 600px) {
            header { padding: 15px 4%; flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: space-between; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="album-title-group">
            <h1 class="font-serif" id="headerTitle">Album • Memuat...</h1>
            <p id="headerSubtitle">Koleksi kenangan autentik.</p>
        </div>
        <div class="header-actions">
            <a href="camera.html" class="btn-custom" id="btnBack">&larr; Kamera</a>
            <button class="btn-custom btn-select-mode" id="btnToggleSelect" onclick="toggleSelectMode()">☑️ Pilih Foto</button>
            <button class="btn-primary-custom" id="btnDownloadSelected" style="display: none;" onclick="unduhFotoTerpilih()">Unduh Terpilih (.zip)</button>
            <button class="btn-primary-custom" id="btnDownloadZip" onclick="unduhSemuaFotoZip()">Unduh Semua (.zip)</button>
        </div>
    </header>

    <div class="main-container">
        <div id="galleryGrid" class="gallery-grid">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;" id="loadingText">
                Memuat galeri foto acara...
            </div>
        </div>
    </div>

    <!-- Modal Lihat Foto Penuh Saat Ditekan -->
    <div class="lightbox-modal" id="photoLightbox" onclick="tutupLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div class="lightbox-top">
                <span class="font-serif" style="font-weight: 700; font-size: 1rem;">Preview Foto</span>
                <button type="button" class="lightbox-close" onclick="tutupLightbox()">✖ Tutup</button>
            </div>
            <div class="lightbox-img-wrap">
                <img id="lightboxImg" src="" alt="Preview Foto Penuh">
            </div>
            <div class="lightbox-caption">
                <span id="lightboxGuest" class="guest-tag">👤 Tamu</span>
                <span id="lightboxTime" class="time-tag">--:--</span>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const rawEventParam = (urlParams.get('event') || '').trim();
        const eventId = rawEventParam;
        const storageScope = (rawEventParam || 'default_event').toLowerCase();
        const isOwner = urlParams.get('owner') === 'true';

        function getAlbumStorageItem(key) {
            try {
                const lsVal = window.localStorage.getItem(key);
                if (lsVal !== null && lsVal !== '') return lsVal;
            } catch (e) {}
            try {
                const cookies = document.cookie ? document.cookie.split(';') : [];
                const target = `${encodeURIComponent(key)}=`;
                for (let c of cookies) {
                    const trimmed = c.trim();
                    if (trimmed.startsWith(target)) {
                        return decodeURIComponent(trimmed.substring(target.length));
                    }
                }
            } catch (e) {}
            return null;
        }

        let globalPhotosList = [];
        let eventMeta = { eventType: 'Event', eventName: 'Album' };
        let isSelectMode = false;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!eventId) {
                document.getElementById('loadingText').innerText = "Event ID tidak valid.";
                return;
            }

            const btnBack = document.getElementById('btnBack');
            btnBack.href = `camera.html?event=${encodeURIComponent(eventId)}`;

            try {
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (!eventDoc.exists) {
                    document.getElementById('loadingText').innerText = "Acara tidak ditemukan.";
                    return;
                }
                const eventData = eventDoc.data();
                
                eventMeta.eventName = eventData.eventName || 'Acara';
                let rawType = eventData.waitingText || "EVENT";
                if (rawType.toLowerCase().includes("wedding")) {
                    eventMeta.eventType = "Wedding_of";
                } else if (rawType.toLowerCase().includes("birthday")) {
                    eventMeta.eventType = "Birthday_of";
                } else {
                    eventMeta.eventType = "Event";
                }

                document.getElementById('headerTitle').innerText = `Album • ${eventData.eventName}`;

                const privacySetting = eventData.privacy || 'visible';
                const savedGuestDisplayName = (getAlbumStorageItem(`tlc_guest_name_${storageScope}`) || '').trim();
                const currentGuestName = savedGuestDisplayName.toLowerCase();
                const currentDeviceId = (getAlbumStorageItem(`tlc_device_id_${storageScope}`) || '').trim();

                if (isOwner) {
                    document.getElementById('headerSubtitle').innerText = "Mode Pemilik Acara: Menampilkan seluruh foto secara lengkap.";
                } else if (privacySetting !== 'visible') {
                    document.getElementById('headerSubtitle').innerText = `Mode Privat: Menampilkan foto milik ${savedGuestDisplayName || 'perangkat Anda'}.`;
                } else {
                    document.getElementById('headerSubtitle').innerText = "Mode Publik: Menampilkan seluruh foto tamu.";
                }

                db.collection('events').doc(eventId).collection('photos')
                    .orderBy('uploadedAt', 'desc')
                    .onSnapshot(snapshot => {
                        const grid = document.getElementById('galleryGrid');
                        globalPhotosList = [];

                        if (snapshot.empty) {
                            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;">Belum ada foto yang diunggah di acara ini.</div>`;
                            return;
                        }

                        snapshot.forEach(doc => {
                            const p = doc.data();

                            // Pada mode privat (bukan owner), utamakan kecocokan deviceId agar tamu bernama sama di HP berbeda tidak saling melihat foto
                            if (!isOwner && privacySetting !== 'visible') {
                                const photoDeviceId = (p.deviceId || '').trim();
                                const photoGuestName = (p.guestName || '').trim().toLowerCase();

                                if (photoDeviceId) {
                                    if (!currentDeviceId || photoDeviceId !== currentDeviceId) {
                                        return;
                                    }
                                } else {
                                    if (!currentGuestName || photoGuestName !== currentGuestName) {
                                        return;
                                    }
                                }
                            }

                            globalPhotosList.push(p);
                        });

                        if (globalPhotosList.length === 0) {
                            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;">Belum ada foto milik Anda yang tersimpan di album ini.</div>`;
                            return;
                        }

                        grid.innerHTML = '';
                        globalPhotosList.forEach((p, index) => {
                            const waktu = p.uploadedAt ? new Date(p.uploadedAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Baru saja';
                            const filterClass = p.filterUsed || 'filter-original';

                            grid.innerHTML += `
                                <div class="photo-card" id="card-${index}" onclick="handleCardClick(${index})">
                                    <input type="checkbox" class="photo-checkbox" id="cb-${index}" data-index="${index}">
                                    <div class="photo-wrapper">
                                        <img src="${p.imageUrl}" class="${filterClass}" alt="Foto Tamu" loading="lazy">
                                    </div>
                                    <div class="photo-footer">
                                        <span class="guest-tag">👤 ${p.guestName || 'Tamu'}</span>
                                        <span class="time-tag">${waktu}</span>
                                    </div>
                                </div>
                            `;
                        });

                        if (isSelectMode) {
                            document.getElementById('galleryGrid').classList.add('selecting');
                        }
                    });

            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Gagal memuat album.";
            }
        });

        function handleCardClick(index) {
            if (isSelectMode) {
                toggleCardSelect(index);
            } else {
                bukaLightbox(index);
            }
        }

        function bukaLightbox(index) {
            const p = globalPhotosList[index];
            if (!p) return;

            const waktu = p.uploadedAt ? new Date(p.uploadedAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Baru saja';
            const filterClass = p.filterUsed || 'filter-original';

            const imgEl = document.getElementById('lightboxImg');
            imgEl.src = p.imageUrl;
            imgEl.className = '';
            imgEl.classList.add(filterClass);

            document.getElementById('lightboxGuest').innerText = `👤 ${p.guestName || 'Tamu'}`;
            document.getElementById('lightboxTime').innerText = waktu;
            document.getElementById('photoLightbox').classList.add('show');
        }

        function tutupLightbox() {
            document.getElementById('photoLightbox').classList.remove('show');
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const btnToggle = document.getElementById('btnToggleSelect');
            const grid = document.getElementById('galleryGrid');
            const cards = document.querySelectorAll('.photo-card');

            if (isSelectMode) {
                btnToggle.classList.add('active');
                btnToggle.innerText = "❌ Batal Pilih";
                grid.classList.add('selecting');
            } else {
                btnToggle.classList.remove('active');
                btnToggle.innerText = "☑️ Pilih Foto";
                grid.classList.remove('selecting');
                cards.forEach(card => {
                    card.classList.remove('selected');
                    const idx = card.id.replace('card-', '');
                    const cb = document.getElementById(`cb-${idx}`);
                    if(cb) cb.checked = false;
                });
                document.getElementById('btnDownloadSelected').style.display = 'none';
                document.getElementById('btnDownloadZip').style.display = 'inline-flex';
            }
        }

        function toggleCardSelect(index) {
            if (!isSelectMode) return;

            const cb = document.getElementById(`cb-${index}`);
            const card = document.getElementById(`card-${index}`);

            cb.checked = !cb.checked;
            if (cb.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }

            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checkedBoxes = document.querySelectorAll('.photo-checkbox:checked');
            const btnSelected = document.getElementById('btnDownloadSelected');
            const btnAll = document.getElementById('btnDownloadZip');

            if (checkedBoxes.length > 0) {
                btnSelected.style.display = 'inline-flex';
                btnSelected.innerText = `Unduh Terpilih (${checkedBoxes.length}) (.zip)`;
                btnAll.style.display = 'none';
            } else {
                btnSelected.style.display = 'none';
                btnAll.style.display = 'inline-flex';
            }
        }

        function getZipFileName(isCustom = false) {
            const cleanEventName = eventMeta.eventName.replace(/[^a-zA-Z0-9]/g, '_');
            const prefix = eventMeta.eventType;
            const suffix = isCustom ? "_Pilihan" : "_Album";
            return `${prefix}_${cleanEventName}${suffix}.zip`;
        }

        async function unduhFotoTerpilih() {
            const checkedBoxes = document.querySelectorAll('.photo-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("Pilih minimal satu foto untuk diunduh.");
                return;
            }

            const btn = document.getElementById('btnDownloadSelected');
            const oldText = btn.innerText;
            btn.innerText = "Menyiapkan ZIP...";
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("Selected_Photos");

            checkedBoxes.forEach((cb) => {
                const i = cb.getAttribute('data-index');
                const photo = globalPhotosList[i];
                try {
                    const base64Data = photo.imageUrl.split(',')[1];
                    const cleanName = (photo.guestName || 'Tamu').replace(/[^a-zA-Z0-9]/g, '_');
                    folder.file(`foto_${parseInt(i) + 1}_${cleanName}.jpg`, base64Data, {base64: true});
                } catch (e) {
                    console.error("Gagal memproses foto:", e);
                }
            });

            const zipFileName = getZipFileName(true);
            zip.generateAsync({ type: "blob" }).then(content => {
                saveAs(content, zipFileName);
                btn.innerText = oldText;
                btn.disabled = false;
                toggleSelectMode(); 
            }).catch(err => {
                alert("Gagal membuat file ZIP.");
                btn.innerText = oldText;
                btn.disabled = false;
            });
        }

        function unduhSemuaFotoZip() {
            if (globalPhotosList.length === 0) {
                alert("Belum ada foto untuk diunduh.");
                return;
            }

            const btn = document.getElementById('btnDownloadZip');
            btn.innerText = "Menyiapkan ZIP...";
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("Album_Photos");

            globalPhotosList.forEach((photo, i) => {
                try {
                    const base64Data = photo.imageUrl.split(',')[1];
                    const cleanName = (photo.guestName || 'Tamu').replace(/[^a-zA-Z0-9]/g, '_');
                    folder.file(`foto_${i + 1}_${cleanName}.jpg`, base64Data, {base64: true});
                } catch (e) {
                    console.error("Gagal memproses foto ke ZIP:", e);
                }
            });

            const zipFileName = getZipFileName(false);
            zip.generateAsync({ type: "blob" }).then(content => {
                saveAs(content, zipFileName);
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            }).catch(err => {
                alert("Gagal membuat file ZIP.");
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
