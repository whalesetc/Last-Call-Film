<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Album Foto • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { 
            --bg-dark: #261C17; 
            --card-bg: #322520;
            --text-light: #E5D178; 
            --text-muted: rgba(229, 209, 120, 0.65); 
            --accent: #D9874F; 
            --secondary-accent: #638073; 
            --mahogany: #6B3D36; 
            --border-color: rgba(107, 61, 54, 0.5); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        .font-serif { font-family: 'Playfair Display', serif; }

        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(38,28,23,0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 15px; }
        .album-title-group h1 { font-size: 1.6rem; color: var(--text-light); font-weight: 700; }
        .album-title-group p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-custom { background: transparent; color: var(--text-light); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-custom:hover { background: rgba(107,61,54,0.3); border-color: var(--accent); }
        
        .btn-primary-custom { background: var(--accent); color: #261C17; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary-custom:hover { background: #e09867; }

        .main-container { padding: 30px 5%; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        
        .photo-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; flex-direction: column; transition: 0.2s; }
        .photo-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .photo-wrapper { width: 100%; aspect-ratio: 1/1; background: #1a120e; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .photo-footer { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(38,28,23,0.9); border-top: 1px solid var(--border-color); }
        .guest-tag { font-size: 0.8rem; font-weight: 600; color: var(--text-light); }
        .time-tag { font-size: 0.7rem; color: var(--text-muted); }

        .filter-original { filter: none; }
        .filter-ultramax { filter: contrast(1.1) saturate(1.2) brightness(1.05) sepia(0.15); }
        .filter-fuji { filter: contrast(1.15) saturate(1.1) hue-rotate(-10deg); }
        .filter-gold { filter: sepia(0.25) contrast(1.05) brightness(1.1) saturate(1.1); }
        .filter-agfa { filter: saturate(1.3) contrast(1.1) hue-rotate(5deg); }
        .filter-portra { filter: brightness(1.1) contrast(0.95) saturate(0.9) sepia(0.1); }
        .filter-flash { filter: contrast(1.35) brightness(1.15) saturate(1.2); }
        .filter-vintage90 { filter: sepia(0.4) contrast(1.1) brightness(0.95); }
        .filter-cinematic { filter: contrast(1.2) saturate(0.8) hue-rotate(180deg) brightness(0.95); }
        .filter-mono { filter: grayscale(100%) contrast(1.2); }

        @media(max-width: 600px) {
            header { padding: 15px 4%; flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: space-between; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="album-title-group">
            <h1 class="font-serif" id="headerTitle">Album • Memuat...</h1>
            <p id="headerSubtitle" id="subText">Koleksi kenangan autentik.</p>
        </div>
        <div class="header-actions">
            <a href="camera.html" class="btn-custom" id="btnBack">&larr; Kembali ke Kamera</a>
            <button class="btn-primary-custom" id="btnDownloadZip" onclick="unduhSemuaFotoZip()">Unduh Semua (.zip)</button>
        </div>
    </header>

    <div class="main-container">
        <div id="galleryGrid" class="gallery-grid">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;" id="loadingText">
                Memuat galeri foto acara...
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        let globalPhotosList = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!eventId) {
                document.getElementById('loadingText').innerText = "Event ID tidak valid.";
                return;
            }

            const btnBack = document.getElementById('btnBack');
            btnBack.href = `camera.html?event=${eventId}`;

            try {
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (!eventDoc.exists) {
                    document.getElementById('loadingText').innerText = "Acara tidak ditemukan.";
                    return;
                }
                const eventData = eventDoc.data();
                document.getElementById('headerTitle').innerText = `Album • ${eventData.eventName}`;

                // Aturan privasi:
                // Jika eventData.privacy === 'visible' -> Tampilkan SEMUA foto dari semua tamu tanpa terkecuali.
                // Jika eventData.privacy diset lain (privat) -> Tamu hanya melihat foto jepretannya sendiri.
                const privacySetting = eventData.privacy || 'visible';
                const currentGuestName = localStorage.getItem(`guest_name_${eventId}`) || '';

                if (privacySetting !== 'visible') {
                    document.getElementById('headerSubtitle').innerText = `Menampilkan foto privat milik: ${currentGuestName || 'Anda'}`;
                }

                db.collection('events').doc(eventId).collection('photos')
                    .orderBy('uploadedAt', 'desc')
                    .onSnapshot(snapshot => {
                        const grid = document.getElementById('galleryGrid');
                        globalPhotosList = [];

                        if (snapshot.empty) {
                            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;">Belum ada foto yang diunggah di acara ini.</div>`;
                            return;
                        }

                        snapshot.forEach(doc => {
                            const p = doc.data();

                            // Filter privasi
                            if (privacySetting !== 'visible') {
                                if (!currentGuestName || p.guestName.toLowerCase() !== currentGuestName.toLowerCase()) {
                                    return; 
                                }
                            }

                            globalPhotosList.push(p);
                        });

                        if (globalPhotosList.length === 0) {
                            grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px 0;">Belum ada foto yang tersedia untuk ditampilkan.</div>`;
                            return;
                        }

                        grid.innerHTML = '';
                        globalPhotosList.forEach((p, index) => {
                            const waktu = p.uploadedAt ? new Date(p.uploadedAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Baru saja';
                            const filterClass = p.filterUsed || 'filter-original';

                            grid.innerHTML += `
                                <div class="photo-card">
                                    <div class="photo-wrapper">
                                        <img src="${p.imageUrl}" class="${filterClass}" alt="Foto Tamu" loading="lazy">
                                    </div>
                                    <div class="photo-footer">
                                        <span class="guest-tag">👤 ${p.guestName || 'Tamu'}</span>
                                        <span class="time-tag">${waktu}</span>
                                    </div>
                                </div>
                            `;
                        });
                    });

            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Gagal memuat album.";
            }
        });

        // Fitur Unduh ZIP Langsung Tanpa Gagal / CORS Error
        function unduhSemuaFotoZip() {
            if (globalPhotosList.length === 0) {
                alert("Belum ada foto untuk diunduh.");
                return;
            }

            const btn = document.getElementById('btnDownloadZip');
            btn.innerText = "Menyiapkan ZIP...";
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("TheLastCall_Album");

            globalPhotosList.forEach((photo, i) => {
                try {
                    // Mengubah format Base64 langsung menjadi file gambar di dalam ZIP tanpa perlu request internet tambahan
                    const base64Data = photo.imageUrl.split(',')[1];
                    const cleanName = (photo.guestName || 'Tamu').replace(/[^a-zA-Z0-9]/g, '_');
                    folder.file(`foto_${i + 1}_${cleanName}.jpg`, base64Data, {base64: true});
                } catch (e) {
                    console.error("Gagal memproses foto ke ZIP:", e);
                }
            });

            zip.generateAsync({ type: "blob" }).then(content => {
                saveAs(content, "Album_TheLastCall.zip");
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            }).catch(err => {
                alert("Gagal membuat file ZIP.");
                btn.innerText = "Unduh Semua (.zip)";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
