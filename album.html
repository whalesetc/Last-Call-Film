<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Call Film • Album Acara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- FIREBASE & JSZIP SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>

    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.55); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { text-align: center; margin-bottom: 20px; padding-top: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; position: relative; }
        .event-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 5px; }
        .photo-count { color: var(--text-muted); font-size: 0.9rem; }
        .btn-back { position: absolute; top: 20px; left: 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.85rem;}
        
        /* Panel Kontrol Seleksi & Unduh */
        .action-bar { max-width: 1000px; margin: 0 auto 20px auto; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .btn-action { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        .btn-primary-action { background: var(--accent); color: #000; border: none; font-weight: bold; }
        
        /* Grid Galeri */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-width: 1000px; margin: 0 auto; width: 100%; flex: 1; padding-bottom: 40px; }
        .photo-item { width: 100%; aspect-ratio: 3 / 4; background: #1a1917; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--border-color); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Checkbox Seleksi */
        .photo-checkbox { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; z-index: 5; display: none; }
        .select-mode .photo-checkbox { display: block; }
        .photo-item.selected { border: 2px solid var(--accent); transform: scale(0.97); }
        
        .empty-state { text-align: center; grid-column: 1 / -1; padding: 80px 20px; color: var(--text-muted); font-style: italic; }
        
        /* Modal Preview */
        #previewModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #previewImage { max-width: 100%; max-height: 75vh; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: contain; }
        .preview-actions { display: flex; gap: 15px; width: 100%; max-width: 350px; }
        .btn-close-modal { flex: 1; padding: 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px; cursor: pointer; }
        .btn-save-modal { flex: 2; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body id="bodyElement">

    <div class="header">
        <a href="javascript:history.back()" class="btn-back">&larr; Kembali</a>
        <h1 class="event-title" id="eventNameDisplay">Memuat Album...</h1>
        <p class="photo-count" id="photoCountDisplay">0 Foto Diambil</p>
    </div>

    <!-- Action Bar untuk Fitur Select & Download -->
    <div class="action-bar" id="actionBar" style="display: none;">
        <div>
            <button class="btn-action" id="btnToggleSelect" onclick="toggleSelectMode()">Pilih Foto</button>
            <button class="btn-action" id="btnSelectAll" onclick="selectAllPhotos()" style="display: none;">Pilih Semua</button>
        </div>
        <div id="downloadGroup" style="display: none;">
            <button class="btn-primary-action btn-action" onclick="downloadSelectedZip()">Unduh ZIP</button>
        </div>
    </div>

    <div class="gallery-grid" id="galleryContainer">
        <div class="empty-state">Mencari rol film acara...</div>
    </div>

    <!-- Modal Preview -->
    <div id="previewModal">
        <img id="previewImage" src="">
        <div class="preview-actions">
            <button class="btn-close-modal" onclick="tutupPreview()">Tutup</button>
            <button class="btn-save-modal" onclick="unduhFotoSatuSatu()">Unduh Foto</button>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase (Hanya butuh Firestore)
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let eventId = new URLSearchParams(window.location.search).get('event');
        let currentDownloadUrl = "";
        let isSelectMode = false;

        if (!eventId) {
            document.getElementById('galleryContainer').innerHTML = "<div class='empty-state'>Tautan album tidak valid.</div>";
        } else {
            db.collection('events').doc(eventId).get().then(doc => { 
                if (doc.exists) document.getElementById('eventNameDisplay').innerText = doc.data().eventName; 
            });
            dengarkanFotoRealtime();
        }

        function dengarkanFotoRealtime() {
            db.collection('events').doc(eventId).collection('photos')
              .orderBy('uploadedAt', 'desc')
              .onSnapshot((snapshot) => {
                  const gallery = document.getElementById('galleryContainer');
                  const countDisplay = document.getElementById('photoCountDisplay');
                  const actionBar = document.getElementById('actionBar');
                  
                  if (snapshot.empty) {
                      gallery.innerHTML = "<div class='empty-state'>Belum ada foto yang diambil.</div>";
                      countDisplay.innerText = "0 Foto Diambil"; 
                      actionBar.style.display = 'none'; 
                      return;
                  }
                  
                  countDisplay.innerText = `${snapshot.size} Foto Diambil`; 
                  actionBar.style.display = 'flex'; 
                  gallery.innerHTML = ""; 
                  
                  snapshot.forEach((doc) => {
                      const data = doc.data();
                      const div = document.createElement('div');
                      div.className = 'photo-item';
                      div.innerHTML = `<input type="checkbox" class="photo-checkbox" value="${data.url}"><img src="${data.url}" loading="lazy">`;
                      
                      div.onclick = (e) => {
                          if (e.target.tagName === 'INPUT') return; 
                          const cb = div.querySelector('.photo-checkbox');
                          if (isSelectMode) { 
                              cb.checked = !cb.checked; 
                              div.classList.toggle('selected', cb.checked); 
                          } else {
                              bukaPreview(data.url);
                          }
                      };
                      
                      div.querySelector('.photo-checkbox').onchange = (e) => {
                          div.classList.toggle('selected', e.target.checked);
                      };
                      
                      gallery.appendChild(div);
                  });
              });
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            document.getElementById('bodyElement').classList.toggle('select-mode', isSelectMode);
            document.getElementById('btnToggleSelect').innerText = isSelectMode ? "Batal Pilih" : "Pilih Foto";
            document.getElementById('btnSelectAll').style.display = isSelectMode ? 'inline-block' : 'none';
            document.getElementById('downloadGroup').style.display = isSelectMode ? 'block' : 'none';
            
            if(!isSelectMode) {
                document.querySelectorAll('.photo-checkbox').forEach(cb => { 
                    cb.checked = false; 
                    cb.parentElement.classList.remove('selected'); 
                });
            }
        }

        function selectAllPhotos() {
            const checkboxes = document.querySelectorAll('.photo-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach((cb) => { 
                cb.checked = !allChecked; 
                cb.parentElement.classList.toggle('selected', !allChecked); 
            });
            document.getElementById('btnSelectAll').innerText = allChecked ? "Pilih Semua" : "Batalkan Semua";
        }

        async function downloadSelectedZip() {
            const checkedBoxes = document.querySelectorAll('.photo-checkbox:checked');
            if (checkedBoxes.length === 0) return alert("Silakan pilih minimal satu foto!");
            
            alert(`Memproses ${checkedBoxes.length} foto menjadi ZIP. Mohon tunggu sebentar...`);
            const zip = new JSZip(), folder = zip.folder("TheLastCall_Album");
            let count = 0;
            
            for (let cb of checkedBoxes) {
                try {
                    const res = await fetch(cb.value);
                    folder.file(`foto_${++count}.jpg`, await res.blob());
                } catch (err) { 
                    console.error("Gagal memuat foto untuk ZIP:", err); 
                }
            }
            
            zip.generateAsync({ type: "blob" }).then((content) => {
                const link = document.createElement('a'); 
                link.href = URL.createObjectURL(content);
                link.download = `TheLastCall_Album_${Date.now()}.zip`;
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link);
            });
        }

        function bukaPreview(url) { 
            currentDownloadUrl = url; 
            document.getElementById('previewImage').src = url; 
            document.getElementById('previewModal').style.display = 'flex'; 
        }

        function tutupPreview() { 
            document.getElementById('previewModal').style.display = 'none'; 
            currentDownloadUrl = ""; 
        }

        function unduhFotoSatuSatu() {
            if (!currentDownloadUrl) return;
            fetch(currentDownloadUrl).then(res => res.blob()).then(blob => {
                const link = document.createElement('a'); 
                link.href = window.URL.createObjectURL(blob);
                link.download = `TheLastCall_${Date.now()}.jpg`;
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link);
                tutupPreview();
            });
        }
    </script>
</body>
</html>
