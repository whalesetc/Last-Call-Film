<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Last Call Film • Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK (Auth & Firestore Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.45); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Playfair Display', serif; }

        /* Navbar */
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.5); }
        .logo { font-size: 1.25rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px;}
        .btn-primary { background: #fff; color: #000; padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; font-size: 0.85rem;}

        /* Pesan Awal */
        #loginMessage { text-align: center; margin-top: 100px; font-size: 1.2rem; color: var(--text-muted); }

        /* Dashboard */
        #dashboardPage { display: none; max-width: 1000px; margin: 0 auto; padding: 40px 5%; }
        .dash-header { margin-bottom: 40px; }
        .dash-header h1 { font-size: 2.5rem; margin-bottom: 5px; }

        /* Panel Admin */
        .admin-panel { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 40px; }
        @media(min-width: 768px) { .admin-panel { grid-template-columns: 1fr 1fr; } }
        
        .dash-card { background: #111; border: 1px solid var(--border-color); padding: 30px; border-radius: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .dash-card h3 { color: var(--text-light); font-size: 1.1rem; margin-bottom: 10px; }
        
        /* QR Code */
        .qr-box { display: flex; align-items: center; gap: 20px; }
        .qr-box img { border-radius: 12px; border: 4px solid #fff; width: 100px; height: 100px;}
        .qr-info p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
        
        /* Galeri */
        .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .gallery-header h2 { font-size: 1.5rem; font-family: 'Playfair Display', serif;}
        
        .admin-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media(min-width: 768px) { .admin-gallery { grid-template-columns: repeat(4, 1fr); } }
        .photo-card { background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; }
        .photo-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
        .photo-info { padding: 10px; text-align: center; }
        .photo-info p { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .photo-info span { font-size: 0.7rem; color: var(--text-muted); }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); border: 1px dashed var(--border-color); border-radius: 16px;}
    </style>
</head>
<body>

    <nav>
        <a class="logo" href="#">✦ The Last Call</a>
        <button class="btn-primary" onclick="auth.signOut()" style="background: transparent; color: #fff; border: 1px solid #333;">Keluar Akun</button>
    </nav>

    <div id="loginMessage">Memeriksa sesi Anda...</div>

    <!-- HALAMAN DASHBOARD ADMIN -->
    <div id="dashboardPage">
        <div class="dash-header">
            <h1 class="font-serif">Dashboard Acara</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Admin: <strong id="dashUserName" style="color: #fff;">-</strong></p>
        </div>

        <div class="admin-panel">
            <!-- Kartu QR Code -->
            <div class="dash-card">
                <h3>Bagikan ke Tamu</h3>
                <div class="qr-box">
                    <img id="qrCodeImage" src="" alt="QR Code">
                    <div class="qr-info">
                        <p>Cetak QR ini di meja undangan agar tamu bisa langsung memotret.</p>
                        <button class="btn-primary" onclick="window.open('camera.html', '_blank')">Buka Kamera &rarr;</button>
                    </div>
                </div>
            </div>

            <!-- Kartu Statistik -->
            <div class="dash-card">
                <h3>Statistik Rol Film</h3>
                <div style="margin-top: 10px;">
                    <p style="font-size: 2.5rem; font-family: 'Playfair Display', serif; font-weight: 600; line-height: 1;"><span id="totalFotoText">0</span></p>
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Total foto berhasil ditangkap</span>
                </div>
            </div>
        </div>

        <!-- Galeri Hasil Foto -->
        <div class="gallery-header">
            <h2>Album Digital</h2>
            <button class="btn-primary" onclick="muatFoto()" style="background: var(--text-muted); color: #000;">🔄 Segarkan</button>
        </div>
        <div class="admin-gallery" id="adminGallery">
            <div class="empty-state">Memuat koleksi foto...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // ==========================================
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA_DISINI",
            authDomain: "MASUKKAN_AUTH_DOMAIN_ANDA_DISINI",
            projectId: "MASUKKAN_PROJECT_ID_ANDA_DISINI",
            storageBucket: "MASUKKAN_STORAGE_BUCKET_ANDA_DISINI",
            messagingSenderId: "MASUKKAN_SENDER_ID_ANDA_DISINI",
            appId: "MASUKKAN_APP_ID_ANDA_DISINI"
        };
        
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Pantau Status Login Admin
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginMessage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                
                const displayName = user.displayName || user.email.split('@')[0];
                document.getElementById('dashUserName').innerText = displayName;
                
                // Buat URL Kamera sesuai nama domain website Anda
                const domainAnda = window.location.href.split('?')[0].replace('index.html', '').replace(/\/$/, '');
                const cameraUrl = domainAnda + "/camera.html";
                document.getElementById('qrCodeImage').src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(cameraUrl);

                // Tarik foto dari database
                muatFoto();
            } else {
                document.getElementById('loginMessage').innerHTML = 'Anda belum login. Harap refresh halaman dan masuk kembali.';
                document.getElementById('dashboardPage').style.display = 'none';
            }
        });

        // Fungsi Tarik Foto dari Database
        async function muatFoto() {
            const gallery = document.getElementById('adminGallery');
            gallery.innerHTML = '<div class="empty-state">Menarik data rol film...</div>';
            
            try {
                // Menarik data foto diurutkan dari yang terbaru
                const snapshot = await db.collection("photos").orderBy("timestamp", "desc").get();
                
                document.getElementById('totalFotoText').innerText = snapshot.size;

                if (snapshot.empty) {
                    gallery.innerHTML = '<div class="empty-state">Belum ada foto. Tunggu tamu Anda menjepret!</div>';
                    return;
                }

                gallery.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let waktuString = "Baru saja";
                    if(data.timestamp) {
                        const t = data.timestamp.toDate();
                        waktuString = t.getHours().toString().padStart(2, '0') + ":" + t.getMinutes().toString().padStart(2, '0');
                    }

                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <a href="${data.url}" target="_blank">
                            <img src="${data.url}" alt="Foto Tamu" loading="lazy">
                        </a>
                        <div class="photo-info">
                            <p>${data.guestName || 'Tamu Anonim'}</p>
                            <span>${waktuString}</span>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error("Gagal muat foto:", error);
                gallery.innerHTML = '<div class="empty-state">Terjadi kesalahan saat memuat database. Hubungi admin.</div>';
            }
        }
    </script>
</body>
</html>
