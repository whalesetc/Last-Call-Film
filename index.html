<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Last Call Film • Buat Acara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.55); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .font-serif { font-family: 'Playfair Display', serif; }

        /* Navbar */
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.25rem; font-weight: 700; color: #fff; cursor: pointer; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-primary { background: #fff; color: #000; padding: 12px 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); }

        /* Sections */
        .section { display: none; padding: 40px 5%; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
        .active-section { display: block; }

        /* Landing Page */
        #landingPage { text-align: center; padding-top: 100px; }
        .hero-title { font-size: 3rem; margin-bottom: 15px; line-height: 1.2; }
        
        /* Dasbor Customer */
        .event-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .event-info h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; }
        .event-info p { color: var(--text-muted); font-size: 0.85rem; }
        .badge { background: var(--accent); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }

        /* Formulir Buat Acara */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; outline: none; font-family: inherit; }
        .form-control:focus { border-color: var(--accent); }
        
        .radio-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .radio-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; cursor: pointer; text-align: center; transition: 0.2s; background: rgba(255,255,255,0.02); }
        .radio-card input { display: none; }
        .radio-card:has(input:checked) { border-color: var(--accent); background: rgba(110, 231, 183, 0.1); }
        .price-tag { font-weight: 700; color: var(--accent); display: block; margin-top: 5px; }

        .file-upload { border: 2px dashed var(--border-color); padding: 30px; text-align: center; border-radius: 8px; color: var(--text-muted); cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div class="logo font-serif" onclick="location.reload()">✦ The Last Call</div>
        <div id="navMenu"></div>
    </nav>

    <!-- 1. HALAMAN LANDING (SEBELUM LOGIN) -->
    <div id="landingPage" class="section active-section">
        <h1 class="hero-title font-serif">Abadikan Momen.<br>Tanpa Batas.</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Platform photobooth digital elegan untuk acaramu.</p>
        <button class="btn-primary" onclick="loginGoogle()">Mulai Buat Acara</button>
    </div>

    <!-- 2. DASBOR CUSTOMER (DAFTAR ACARA MEREKA) -->
    <div id="customerDashboard" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="font-serif" style="font-size: 2rem;">Acara Saya</h2>
            <button class="btn-primary" onclick="bukaForm()">+ Buat Baru</button>
        </div>
        <div id="eventList">
            <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">Memuat acara...</div>
        </div>
    </div>

    <!-- 3. FORMULIR PEMBUATAN ACARA BARU -->
    <div id="createEventForm" class="section">
        <button class="btn-outline" onclick="bukaDasbor()" style="margin-bottom: 20px;">&larr; Kembali</button>
        <h2 class="font-serif" style="font-size: 2rem; margin-bottom: 20px;">Detail Acara Baru</h2>
        
        <form id="eventForm">
            <!-- Jenis & Nama Acara -->
            <div class="form-group">
                <label>Jenis Acara</label>
                <select id="eventType" class="form-control" onchange="updatePlaceholder()">
                    <option value="Wedding">Wedding (Pernikahan)</option>
                    <option value="Birthday">Birthday (Ulang Tahun)</option>
                    <option value="Event">Event Lainnya</option>
                </select>
            </div>
            
            <div class="form-group">
                <label id="labelEventName">Nama Mempelai (Contoh: Romeo & Juliet)</label>
                <input type="text" id="eventName" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Tanggal Acara</label>
                <input type="date" id="eventDate" class="form-control" required>
            </div>

            <!-- Privasi Galeri -->
            <div class="form-group">
                <label>Privasi Galeri Foto Tamu</label>
                <div class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="privacy" value="visible" checked>
                        <strong>Publik (Visible)</strong>
                        <span style="display:block; font-size:0.75rem; color:var(--text-muted)">Semua tamu bisa melihat galeri</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="privacy" value="private">
                        <strong>Privat (Private)</strong>
                        <span style="display:block; font-size:0.75rem; color:var(--text-muted)">Tamu hanya melihat fotonya sendiri</span>
                    </label>
                </div>
            </div>

            <!-- Pilihan Paket Kuota -->
            <div class="form-group">
                <label>Pilihan Kuota Pengguna (Tamu)</label>
                <div class="radio-group" id="packageGroup">
                    <label class="radio-card"><input type="radio" name="package" value="5" required>5 Orang<span class="price-tag">Gratis</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="10">10 Orang<span class="price-tag">Rp 50.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="25">25 Orang<span class="price-tag">Rp 85.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="50">50 Orang<span class="price-tag">Rp 160.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="100">100 Orang<span class="price-tag">Rp 250.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="150">150 Orang<span class="price-tag">Rp 350.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="200">200 Orang<span class="price-tag">Rp 470.000</span></label>
                    <label class="radio-card"><input type="radio" name="package" value="unlimited">Tak Terbatas<span class="price-tag">Rp 800.000</span></label>
                </div>
            </div>

            <!-- Upload Wallpaper -->
            <div class="form-group">
                <label>Wallpaper / Sampul Kamera Tamu</label>
                <label class="file-upload">
                    <input type="file" id="wallpaperFile" accept="image/*" style="display:none;" onchange="previewFile()">
                    <span id="fileName">Klik untuk unggah gambar dari perangkat (Format vertikal lebih baik)</span>
                </label>
            </div>

            <button type="submit" id="btnSubmit" class="btn-primary" style="width: 100%; margin-top: 20px;">Buat & Proses Pembayaran</button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // FUNGSI NAVIGASI TAMPILAN
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active-section'));
            document.getElementById(sectionId).classList.add('active-section');
        }

        function bukaDasbor() { showSection('customerDashboard'); muatAcaraSaya(); }
        function bukaForm() { showSection('createEventForm'); document.getElementById('eventForm').reset(); document.getElementById('fileName').innerText = "Klik untuk unggah gambar dari perangkat"; }
        
        function updatePlaceholder() {
            const tipe = document.getElementById('eventType').value;
            const label = document.getElementById('labelEventName');
            if(tipe === "Wedding") label.innerText = "Nama Mempelai (Contoh: Romeo & Juliet)";
            else if(tipe === "Birthday") label.innerText = "Nama yang Ulang Tahun (Contoh: Rina's 21st)";
            else label.innerText = "Nama Event (Contoh: Reuni Akbar Angkatan 2010)";
        }

        function previewFile() {
            const file = document.getElementById('wallpaperFile').files[0];
            if(file) document.getElementById('fileName').innerText = "Terpilih: " + file.name;
        }

        // FUNGSI AUTENTIKASI
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const navMenu = document.getElementById('navMenu');
            if (user) {
                navMenu.innerHTML = `<button class="btn-outline" onclick="auth.signOut()">Keluar Akun</button>`;
                bukaDasbor(); // Langsung buka dasbor customer jika login
                
                // Simpan data user ke database
                db.collection('users').doc(user.uid).set({
                    name: user.displayName,
                    email: user.email,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

            } else {
                navMenu.innerHTML = `<button class="btn-primary" onclick="loginGoogle()">Masuk</button>`;
                showSection('landingPage');
            }
        });

        // MENAMPILKAN DAFTAR ACARA MILIK CUSTOMER
        async function muatAcaraSaya() {
            if(!currentUser) return;
            const listDiv = document.getElementById('eventList');
            listDiv.innerHTML = '<p style="text-align:center; color:#888;">Memuat data...</p>';

            try {
                // Ambil acara yang dimiliki user yang sedang login saja
                const snapshot = await db.collection("events").where("ownerId", "==", currentUser.uid).orderBy("createdAt", "desc").get();
                
                if (snapshot.empty) {
                    listDiv.innerHTML = '<div style="text-align: center; padding: 40px; border: 1px dashed #444; border-radius: 12px; color: #888;">Anda belum membuat acara. Klik tombol Buat Baru.</div>';
                    return;
                }

                listDiv.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let statusBadge = data.status === 'Aktif' ? '<span class="badge" style="background:#6ee7b7;">Aktif</span>' : '<span class="badge" style="background:#fbbc05;">Menunggu Pembayaran</span>';
                    
                    listDiv.innerHTML += `
                        <div class="event-card">
                            <div class="event-info">
                                <h3>${data.eventName} <span style="font-size:0.8rem; font-weight:normal;">(${data.eventType})</span></h3>
                                <p>Tanggal: ${data.date} • Paket: ${data.quota === 9999 ? 'Tak Terbatas' : data.quota + ' Orang'} • Privasi: ${data.privacy}</p>
                                <p style="margin-top: 5px;">${statusBadge}</p>
                            </div>
                            <div>
                                <button class="btn-outline" onclick="alert('Kode QR & Dasbor Acara sedang dalam pengembangan untuk tahap berikutnya!')">Kelola Acara</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                listDiv.innerHTML = '<p style="color:red; text-align:center;">Gagal memuat acara. Pastikan pengaturan Index Firestore sudah benar.</p>';
            }
        }

        // MENYIMPAN ACARA BARU KE DATABASE FIREBASE
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            const eventType = document.getElementById('eventType').value;
            const eventName = document.getElementById('eventName').value;
            const eventDate = document.getElementById('eventDate').value;
            const privacy = document.querySelector('input[name="privacy"]:checked').value;
            
            // Logika Paket (Harga & Kuota)
            const packageVal = document.querySelector('input[name="package"]:checked').value;
            let kuota = parseInt(packageVal);
            let harga = 0;
            if (packageVal === "unlimited") { kuota = 9999; harga = 800000; }
            else if (kuota === 5) harga = 0;
            else if (kuota === 10) harga = 50000;
            else if (kuota === 25) harga = 85000;
            else if (kuota === 50) harga = 160000;
            else if (kuota === 100) harga = 250000;
            else if (kuota === 150) harga = 350000;
            else if (kuota === 200) harga = 470000;

            // Proses Upload Gambar Wallpaper ke ImgBB
            let wallpaperUrl = "";
            const fileInput = document.getElementById('wallpaperFile').files[0];
            if (fileInput) {
                btn.innerText = "Mengunggah Wallpaper...";
                const formData = new FormData();
                formData.append('image', fileInput);
                // Menggunakan API Key ImgBB Anda sebelumnya
                try {
                    const response = await fetch('https://api.imgbb.com/1/upload?key=16a4714fa54ed030ef5416ae07a05f68', { method: 'POST', body: formData });
                    const result = await response.json();
                    if (result.success) wallpaperUrl = result.data.url;
                } catch(err) {
                    alert("Gagal mengunggah gambar. Pastikan gambar tidak terlalu besar.");
                }
            }

            btn.innerText = "Menyimpan Acara...";

            // Menyimpan Data Acara ke Database Firestore Anda
            try {
                await db.collection("events").add({
                    ownerId: currentUser.uid,
                    ownerEmail: currentUser.email,
                    eventType: eventType,
                    eventName: eventName,
                    date: eventDate,
                    privacy: privacy,
                    quota: kuota,
                    remainingQuota: kuota,
                    price: harga,
                    wallpaperUrl: wallpaperUrl,
                    status: harga === 0 ? "Aktif" : "Pending", // Gratis langsung aktif
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert(harga === 0 ? "Acara berhasil dibuat secara gratis!" : `Pesanan Diterima! Silakan bayar sebesar Rp ${harga.toLocaleString('id-ID')} agar QR Code aktif.`);
                bukaDasbor();
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan saat menyimpan data.");
            } finally {
                btn.innerText = "Buat & Proses Pembayaran";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
