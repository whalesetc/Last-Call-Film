<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disposable Cam</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #ffd700;
        margin: 0;
        font-family: "Courier New", Courier, monospace;
        transition: background-color 0.1s ease;
      }
      .kamera-box {
        text-align: center;
        background: #222;
        padding: 40px 20px;
        border-radius: 15px;
        color: white;
        width: 85%;
        max-width: 350px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }
      .counter {
        background: black;
        color: #ff3b30;
        padding: 5px 15px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 5px;
        display: inline-block;
        margin-bottom: 30px;
        border: 2px solid #555;
      }
      .shutter-btn {
        background: #ff3b30;
        color: white;
        border: 4px solid #aa1111;
        font-size: 20px;
        font-weight: bold;
        border-radius: 50%;
        width: 110px;
        height: 110px;
        cursor: pointer;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5),
          0 5px 10px rgba(0, 0, 0, 0.4);
        transition: transform 0.1s;
      }
      .shutter-btn:active {
        transform: scale(0.95);
      }
      #kameraAsli {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="kamera-box">
      <div class="counter">36</div>
      <p style="margin-top: 0; color: #ccc; font-size: 14px">EVENT CAM</p>

      <input
        type="file"
        id="kameraAsli"
        accept="image/*"
        capture="environment"
      />

      <button
        class="shutter-btn"
        onclick="document.getElementById('kameraAsli').click()"
      >
        Jepret
      </button>
    </div>

    <script>
      const inputKamera = document.getElementById("kameraAsli");
      const counterTeks = document.querySelector(".counter");
      let sisaFilm = 36;

      // API Key ImgBB Anda yang sudah dimasukkan
      const imgbbAPIKey = "16a4714fa54ed030ef5416ae07a05f68";

      inputKamera.addEventListener("change", function (event) {
        const file = event.target.files[0];

        if (file) {
          // 1. Kurangi sisa film
          if (sisaFilm > 0) {
            sisaFilm--;
            counterTeks.innerText = sisaFilm;
          }

          // 2. Efek Flash
          document.body.style.backgroundColor = "white";
          setTimeout(() => {
            document.body.style.backgroundColor = "#FFD700";
          }, 150);

          // 3. Proses Upload ke ImgBB
          const formData = new FormData();
          formData.append("image", file);

          fetch(`https://api.imgbb.com/1/upload?key=${imgbbAPIKey}`, {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                console.log("Berhasil diunggah! Link foto:", data.data.url);
                alert("Foto berhasil diproses ke album!");
              } else {
                alert("Gagal mengunggah foto.");
              }
            })
            .catch((error) => {
              console.error("Error upload:", error);
              alert("Koneksi internet bermasalah.");
            });

          // 4. Reset input
          event.target.value = "";
        }
      });
    </script>
  </body>
</html>
