<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Call Film - Digital Guestbook</title>
    <!-- Menggunakan font elegan dan klasik -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0; /* Warna cream/beige lembut ala wedding */
            --text-main: #2c2a29;
            --text-muted: #8b8882;
            --accent: #a38c6d;
            --white: #ffffff;
            --border-light: #e8e5de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Container utama ala tampilan mobile app */
        .app-container {
            width: 100%;
            max-width: 480px; /* Dibuat lebih ramping agar proporsional di semua layar */
            margin: 0 auto;
        }

        /* Header Elegan */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Box Kamera seperti bingkai foto */
        .camera-wrapper {
            background: var(--white);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            margin-bottom: 30px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4; /* Rasio foto portrait klasik */
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        /* Kontrol Input Minimalis */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .input-group {
            position: relative;
        }

        /* Input hanya garis bawah ala form undangan mewah */
        input[type="text"] {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            color: var(--text-main);
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="text"]:focus {
            border-bottom: 1px solid var(--text-main);
        }

        input[type="text"]::placeholder {
            color: #b3b3b3;
            font-weight: 300;
        }

        /* Tombol Pill-shaped yang elegan */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background-color: var(--text-main);
            color: var(--white);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(163, 140, 109, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-register {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            margin-top: -5px;
        }

        .btn-register:hover {
            background-color: var(--text-main);
            color: var(--white);
            box-shadow: none;
        }

        /* Bagian Galeri bergaya Polaroid */
        .album-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-light);
            padding-top: 40px;
        }

        .album-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 400;
        }

        /* Dibuat 2 kolom agar foto lebih besar dan jelas di mobile */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Gaya kartu foto cetak */
        .gallery-item {
            background: var(--white);
            padding: 8px 8px 12px 8px;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .gallery-item:nth-child(even) {
            transform: rotate(2deg);
        }

        .gallery-item:nth-child(odd) {
            transform: rotate(-1deg);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 2px;
            background: #eee;
        }

        /* Nama ditulis di bawah foto seperti tulisan tangan */
        .guest-tag {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-main);
            text-align: center;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>The Last Call Film</h1>
            <p class="subtitle">Disposable Camera</p>
        </header>

        <div class="camera-wrapper">
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="guestName" placeholder="Tulis nama Anda di sini..." autocomplete="off">
            </div>
            
            <button id="captureBtn">Jepret Foto</button>
            <button class="btn-register" onclick="alert('Silakan hubungi admin untuk melanjutkan pendaftaran sesi acara.')">Info Pendaftaran</button>
            
            <div id="status" class="status-msg"></div>
        </div>

        <div class="album-section">
            <h2 class="album-title">Guest Memories</h2>
            <div class="gallery-grid" id="galleryGrid">
                <!-- Foto akan muncul di sini dengan gaya polaroid -->
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const guestNameInput = document.getElementById('guestName');
        const statusDiv = document.getElementById('status');
        const galleryGrid = document.getElementById('galleryGrid');

        // Cek Pengaturan dari Admin (disimpan di browser)
        const namaMempelai = localStorage.getItem('mempelaiName');
        const batasFoto = parseInt(localStorage.getItem('maxPhotos')) || 0;
        let jumlahFotoSekarang = parseInt(localStorage.getItem('currentPhotoCount')) || 0;

        // Ubah judul jika ada sesi aktif yang diatur dari admin.html
        if (namaMempelai) {
            document.querySelector('h1').innerText = namaMempelai;
            document.querySelector('.subtitle').innerText = "Wedding Guestbook";
            statusDiv.innerText = `Sisa kuota: ${batasFoto - jumlahFotoSekarang} foto`;
        }

        // Nyalakan Kamera Depan
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                statusDiv.innerText = "Gagal mengakses kamera. Izinkan akses kamera pada browser Anda.";
            }
        }
        initCamera();

        // Ambil Foto & Unggah ke ImgBB
        captureBtn.addEventListener('click', async () => {
            if (namaMempelai && jumlahFotoSekarang >= batasFoto) {
                alert('Mohon maaf, roll film untuk sesi acara ini telah habis.');
                return;
            }

            const name = guestNameInput.value.trim();
            if (!name) {
                alert('Mohon isi nama Anda terlebih dahulu.');
                guestNameInput.focus();
                return;
            }

            statusDiv.innerText = "Memproses memori...";
            captureBtn.disabled = true;

            // Flash effect manual sederhana
            video.style.opacity = '0';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);
            const base64Image = imageDataUrl.split(',')[1];

            // Kunci API ImgBB
            const IMGBB_API_KEY = '16a4714fa54ed030ef5416ae07a05f68'; 
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', base64Image);

            try {
                const response = await fetch('https://api.imgbb.com/1/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    const uploadedImageUrl = result.data.url;
                    addPhotoToGallery(uploadedImageUrl, name);
                    
                    if (namaMempelai) {
                        jumlahFotoSekarang++;
                        localStorage.setItem('currentPhotoCount', jumlahFotoSekarang);
                        statusDiv.innerText = `Berhasil! Sisa kuota: ${batasFoto - jumlahFotoSekarang} foto`;
                    } else {
                        statusDiv.innerText = "Memori tersimpan. Terima kasih!";
                    }
                    
                    guestNameInput.value = "";
                } else {
                    statusDiv.innerText = "Gagal menyimpan foto.";
                }
            } catch (error) {
                statusDiv.innerText = "Terjadi gangguan koneksi internet.";
            } finally {
                captureBtn.disabled = false;
                if (!namaMempelai) {
                    setTimeout(() => { statusDiv.innerText = ""; }, 4000);
                }
            }
        });

        // Menambahkan foto ke galeri dengan gaya cetakan
        function addPhotoToGallery(imgUrl, guestName) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${imgUrl}" alt="Guest Photo">
                <div class="guest-tag">${guestName}</div>
            `;
            galleryGrid.prepend(item);
        }
    </script>
</body>
</html>
