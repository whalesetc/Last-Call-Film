<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Tamu - The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-app: #f7f5f0; --text-app: #2c2a29; --accent: #a38c6d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-app); line-height: 1.6; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        
        .app-container { width: 100%; max-width: 480px; margin: 0 auto; position: relative; }
        .app-header { text-align: center; margin-bottom: 20px; position: relative;}
        .app-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 600; }
        .app-subtitle { font-size: 0.85rem; color: #8b8882; letter-spacing: 2px; text-transform: uppercase; }
        
        .guest-input-box { margin-bottom: 20px; }
        .guest-input-box input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-family: inherit; font-size: 1rem; text-align: center; outline: none; background: #fff; color: #000;}

        .camera-wrapper { background: #fff; padding: 12px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); margin-bottom: 30px; }
        .camera-box { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #111; border-radius: 8px; overflow: hidden; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        .btn-capture { width: 100%; padding: 16px; border: none; border-radius: 30px; background-color: var(--text-app); color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .status-msg { text-align: center; font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-top: 15px;}
        
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 40px; }
        .gallery-item { background: #fff; padding: 8px 8px 12px 8px; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; }
        .gallery-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 2px; }
        .guest-tag { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.9rem; margin: 8px 0; }
        .btn-download { display: inline-block; padding: 6px 12px; background-color: var(--text-app); color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: 600; border-radius: 15px; margin-top: auto;}
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1 class="app-title">Kamera Tamu</h1>
            <p class="app-subtitle">Disposable Cam</p>
        </div>

        <div class="guest-input-box">
            <input type="text" id="namaTamuInput" placeholder="Ketik nama Anda di sini..." autocomplete="off">
        </div>

        <div class="camera-wrapper">
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="controls">
            <button class="btn-capture" id="captureBtn">Jepret Foto</button>
            <div id="status" class="status-msg">Silakan jepret momen seru!</div>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1",
            measurementId: "G-31E0XP89W5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const galleryGrid = document.getElementById('galleryGrid');
        const namaTamuInput = document.getElementById('namaTamuInput');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                statusDiv.innerText = "Gagal akses kamera.";
            }
        }
        initCamera();

        captureBtn.addEventListener('click', async () => {
            const namaTamu = namaTamuInput.value.trim() || "Tamu Anonim";

            captureBtn.disabled = true;
            statusDiv.innerText = "Menyimpan foto...";
            
            video.style.opacity = '0';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            // Kompresi ukuran gambar agar sangat ringan
            const MAX_WIDTH = 600;
            const scale = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.5);

            // Tampilkan di galeri lokal tamu
            const namaFile = `TLC_${Date.now()}.jpg`;
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${imageDataUrl}">
                <div class="guest-tag">${namaTamu}</div>
                <a href="${imageDataUrl}" download="${namaFile}" class="btn-download">↓ Simpan</a>
            `;
            galleryGrid.prepend(item);

            try {
                // Simpan langsung format gambar ke database Firestore
                await db.collection("photos").add({
                    url: imageDataUrl,
                    guestName: namaTamu,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                statusDiv.innerText = "Berhasil disimpan ke database!";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Gagal menyimpan. Cek koneksi.";
            } finally {
                captureBtn.disabled = false;
                setTimeout(() => { statusDiv.innerText = "Silakan jepret momen seru!"; }, 2000);
            }
        });
    </script>
</body>
</html>
