<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Last Call Film • Kamera Tamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage-compat.js"></script> <!-- Tambahan Storage untuk simpan foto -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Loading Screen */
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #loadingText { margin-top: 20px; font-family: 'Playfair Display', serif; font-size: 1.5rem; }

        /* Header Info */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
        .event-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .film-counter { background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); font-size: 0.9rem; font-weight: bold; font-variant-numeric: tabular-nums; backdrop-filter: blur(5px); }

        /* Status Bar (Untuk Demo Mode) */
        #statusBar { background-color: #ef4444; color: #fff; text-align: center; padding: 8px; font-size: 0.8rem; font-weight: bold; display: none; width: 100%; position: absolute; top: 60px; z-index: 9; }

        /* Viewfinder Kamera */
        .camera-container { flex: 1; position: relative; overflow: hidden; background: #111; display: flex; align-items: center; justify-content: center;}
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Efek Flash */
        #flashEffect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out; z-index: 20; }
        .flash-active { opacity: 1 !important; }

        /* Kontrol Bawah */
        .controls { padding: 30px 20px 40px; background: #000; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-album { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 10px 15px; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.2s;}
        .btn-album:active { background: rgba(255,255,255,0.2); }

        .btn-capture { width: 70px; height: 70px; border-radius: 50%; background: transparent; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; transition: transform 0.1s; }
        .btn-capture-inner { width: 54px; height: 54px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .btn-capture:active .btn-capture-inner { background: #ccc; transform: scale(0.9); }
        .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-switch { width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; color: #fff; font-size: 1.2rem;}
        
        canvas { display: none; } /* Tersembunyi, hanya untuk memproses foto */
    </style>
</head>
<body>

    <!-- Layar Pemuatan -->
    <div id="loadingScreen">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent, #6ee7b7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
        <div id="loadingText">Menyiapkan Roll Film...</div>
    </div>

    <!-- Antarmuka Kamera -->
    <div class="header">
        <div class="event-name" id="displayEventName">Memuat...</div>
        <div class="film-counter" id="displayFilmCounter">-- / --</div>
    </div>

    <div id="statusBar">🔴 MODE DEMO - Foto tidak masuk ke album pengantin</div>

    <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline></video>
        <div id="flashEffect"></div>
    </div>

    <div class="controls">
        <a href="#" id="btnToAlbum" class="btn-album">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Album
        </a>
        
        <button class="btn-capture" id="btnCapture" onclick="jepretFoto()">
            <div class="btn-capture-inner"></div>
        </button>

        <button class="btn-switch" onclick="tukarKamera()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.44-5.44"></path></svg>
        </button>
    </div>

    <canvas id="photoCanvas"></canvas>

    <script>
        // 1. Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 2. Variabel Kamera & Data Acara
        let eventId = null;
        let eventData = null;
        let isDemoMode = false;
        let maxPhotos = 15; // Default jika gagal muat
        let photosTaken = 0;
        
        let videoStream = null;
        let currentFacingMode = 'environment'; // 'environment' = kamera belakang, 'user' = kamera depan

        // Elemen DOM
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('photoCanvas');
        const btnCapture = document.getElementById('btnCapture');

        // 3. Inisialisasi Halaman
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            eventId = urlParams.get('event');

            if (!eventId) {
                alert("Tautan kamera tidak valid atau rusak.");
                document.getElementById('loadingText').innerText = "Tautan Tidak Valid";
                return;
            }

            document.getElementById('btnToAlbum').href = `album.html?event=${eventId}`;
            await muatDataAcara();
            await mulaiKamera();
        };

        // 4. Muat Data Acara & Cek Mode Demo
        async function muatDataAcara() {
            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (!doc.exists) {
                    alert("Acara tidak ditemukan!");
                    return;
                }

                eventData = doc.data();
                document.getElementById('displayEventName').innerText = eventData.eventName;
                maxPhotos = eventData.guestPhotoLimit || 15;

                // Hitung riwayat jepretan tamu dari penyimpanan HP (localStorage)
                const storageKey = `lastcall_${eventId}_count`;
                photosTaken = parseInt(localStorage.getItem(storageKey)) || 0;
                
                // === LOGIKA WAKTU / DEMO MODE ===
                const waktuSekarang = new Date();
                const startDateTime = new Date(`${eventData.date}T${eventData.startTime || '00:00'}:00`);
                const endDateTime = new Date(`${eventData.date}T${eventData.endTime || '23:59'}:59`);

                if (waktuSekarang < startDateTime || waktuSekarang > endDateTime) {
                    isDemoMode = true;
                    document.getElementById('statusBar').style.display = 'block';
                    alert("MODE DEMO AKTIF\n\nAcara belum dimulai atau sudah selesai. Anda dapat mencoba menjepret, foto akan otomatis tersimpan ke Galeri HP Anda, tetapi TIDAK akan masuk ke album pengantin dan jatah Roll Film Anda tidak akan berkurang.");
                    document.getElementById('displayFilmCounter').innerText = `DEMO`;
                } else {
                    isDemoMode = false;
                    perbaruiTampilanRoll();
                }

                // Sembunyikan loading
                setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; }, 1000);

            } catch (error) {
                console.error("Error memuat acara:", error);
                alert("Gagal memuat data acara. Pastikan koneksi internet stabil.");
            }
        }

        function perbaruiTampilanRoll() {
            if (isDemoMode) return;
            const sisa = maxPhotos - photosTaken;
            document.getElementById('displayFilmCounter').innerText = `${sisa} / ${maxPhotos}`;
            if (sisa <= 0) {
                btnCapture.disabled = true;
                alert("Roll Film Anda sudah habis! Terima kasih telah mengabadikan kenangan.");
            }
        }

        // 5. Akses Kamera
        async function mulaiKamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { facingMode: currentFacingMode, width: { ideal: 1080 }, height: { ideal: 1920 } },
                audio: false
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = videoStream;
            } catch (error) {
                console.error("Error akses kamera:", error);
                alert("Gagal mengakses kamera. Harap izinkan akses kamera di pengaturan browser Anda.");
            }
        }

        function tukarKamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            mulaiKamera();
        }

        // 6. Fungsi Menjepret Foto
        function jepretFoto() {
            if (!isDemoMode && photosTaken >= maxPhotos) {
                alert("Roll film Anda telah habis!");
                return;
            }

            // Efek Flash Layar
            const flash = document.getElementById('flashEffect');
            flash.classList.add('flash-active');
            setTimeout(() => { flash.classList.remove('flash-active'); }, 150);

            // Set ukuran canvas sesuai video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Jika kamera depan (user), balik/mirror gambar secara horizontal
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            // Gambar frame ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Konversi gambar menjadi file format JPEG kualitas tinggi (90%)
            const dataURL = canvas.toDataURL('image/jpeg', 0.9);

            // Simpan foto otomatis ke penyimpanan HP Tamu
            simpanKeGaleriHP(dataURL);

            // Jika Mode Live (Bukan Demo), Upload ke Database
            if (!isDemoMode) {
                photosTaken++;
                localStorage.setItem(`lastcall_${eventId}_count`, photosTaken);
                perbaruiTampilanRoll();
                uploadKeFirebase(dataURL);
            }
        }

        // 7. Simpan Foto Secara Lokal ke HP
        function simpanKeGaleriHP(dataURL) {
            const a = document.createElement('a');
            a.href = dataURL;
            a.download = `LastCall_Snap_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 8. Upload Foto ke Firebase Storage & Firestore
        function uploadKeFirebase(dataURL) {
            const fileName = `foto_${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
            const storageRef = storage.ref(`events/${eventId}/${fileName}`);

            // Tampilkan info sedang memproses (Opsional, agar user tidak bingung)
            const btnInner = document.querySelector('.btn-capture-inner');
            btnInner.style.background = '#6ee7b7'; // Hijau saat proses upload
            
            // Upload Base64 Data URL
            storageRef.putString(dataURL, 'data_url').then((snapshot) => {
                snapshot.ref.getDownloadURL().then((downloadURL) => {
                    // Simpan URL foto ke koleksi Firestore khusus album acara ini
                    db.collection('events').doc(eventId).collection('photos').add({
                        url: downloadURL,
                        uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Kembalikan warna tombol jepret
                    btnInner.style.background = '#fff';
                });
            }).catch((error) => {
                console.error("Gagal mengunggah foto ke album utama:", error);
                alert("Sinyal lemah, foto gagal terunggah ke album pengantin (tetapi sudah tersimpan di galeri HP Anda).");
                btnInner.style.background = '#fff';
                
                // Refund 1 jatah kuota jika gagal terunggah (Fair play)
                photosTaken--;
                localStorage.setItem(`lastcall_${eventId}_count`, photosTaken);
                perbaruiTampilanRoll();
            });
        }
    </script>
</body>
</html>
