<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Last Call Film • Kamera Tamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --accent: #6ee7b7; --border: rgba(255,255,255,0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .screen { display: none; flex-direction: column; min-height: 100vh; width: 100%; position: relative; }
        .screen.active { display: flex; }

        /* Layar Selamat Datang */
        #welcomeScreen { justify-content: flex-end; align-items: center; padding: 30px 20px; background-size: cover; background-position: center; position: relative; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.3) 100%); z-index: 1; }
        .welcome-content { position: relative; z-index: 2; width: 100%; max-width: 400px; text-align: center; }
        .welcome-content input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: #fff; text-align: center; font-size: 1rem; outline: none; backdrop-filter: blur(10px); }
        .btn-primary { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #fff; color: #000; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.97); }

        /* HEADER KAMERA (Custom Judul) */
        .camera-header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 30; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .camera-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; text-align: center; flex: 1; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); }
        .icon-btn:active { background: rgba(255,255,255,0.3); }

        /* Layar Kamera */
        #cameraContainer { 
            flex: 1; 
            position: relative; 
            background: var(--bg-dark); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 90px 20px 210px 20px;
        }
        video { 
            width: 100%; 
            max-width: 400px; 
            aspect-ratio: 3/4; 
            object-fit: cover; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            transform: scaleX(-1); 
            transition: transform 0.3s; 
        }
        video.no-mirror { transform: scaleX(1); }
        
        /* BOTTOM UI KAMERA */
        .camera-ui { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); z-index: 20; }
        
        .roll-counter { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px 15px; text-align: center; cursor: pointer; backdrop-filter: blur(5px); min-width: 65px; transition: 0.2s; }
        .roll-counter:active { transform: scale(0.95); }
        
        .btn-capture { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; margin: 0 10px; }
        .btn-capture .inner-circle { width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: 0.1s; }
        .btn-capture:active .inner-circle { transform: scale(0.85); background: #ddd; }
        
        .btn-switch { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        
        /* Film Strip (Pratinjau Hasil Jepretan) */
        .film-strip { position: absolute; bottom: 125px; left: 0; width: 100%; height: 80px; display: flex; gap: 12px; padding: 0 20px; overflow-x: auto; z-index: 15; scroll-behavior: smooth; }
        .film-strip::-webkit-scrollbar { display: none; }
        .film-strip img { height: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-shrink: 0; animation: popIn 0.3s ease-out forwards; background: #222; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Layar Galeri */
        #galleryScreen { padding: 20px; background: var(--bg-dark); }
        .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .grid-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .photo-item { position: relative; border-radius: 12px; overflow: hidden; background: #222; aspect-ratio: 3/4; cursor: pointer; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-lihat { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; justify-content: center; align-items: center; flex-direction: column; }
        #lightbox img { max-width: 90%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .btn-close-lightbox { position: absolute; top: 25px; right: 25px; background: rgba(255,255,255,0.2); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }

        /* Loading Screen */
        #loadingScreen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 99999; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="lightbox">
        <button class="btn-close-lightbox" onclick="tutupLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="Pratinjau Foto">
        <p style="color: rgba(255,255,255,0.6); font-size: 0.8rem; margin-top: 15px;">Tekan & Tahan gambar untuk menyimpan</p>
    </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <h3 class="font-serif" id="loadingText" style="font-size: 1.5rem;">Memuat Sistem...</h3>
    </div>

    <!-- SCREEN 1: WELCOME -->
    <div id="welcomeScreen" class="screen">
        <div class="overlay"></div>
        <div class="welcome-content">
            <h1 class="font-serif" id="displayEventName" style="font-size: 2.2rem; margin-bottom: 5px; line-height: 1.2;">Nama Acara</h1>
            <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 25px;">Photobooth Digital</p>
            
            <input type="text" id="guestNameInput" placeholder="Masukkan Nama Anda (Contoh: Budi)" required>
            <button class="btn-primary" onclick="masukKamera()">Buka Kamera</button>
        </div>
    </div>

    <!-- SCREEN 2: KAMERA -->
    <div id="cameraScreen" class="screen">
        <div class="camera-header">
            <button class="icon-btn" onclick="kembaliKeWelcome()">&larr;</button>
            <div class="camera-title" id="cameraTopTitle">Judul Acara</div>
            <button class="icon-btn" onclick="alert('Bagikan link ini ke teman lain yang hadir di acara ini!')">🔗</button>
        </div>

        <div id="cameraContainer">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasElement" style="display: none;"></canvas>
        </div>

        <div class="film-strip" id="filmStrip"></div>

        <div class="camera-ui">
            <div class="roll-counter" onclick="bukaGaleri()" title="Lihat Galeri Saya">
                <span style="font-size: 0.65rem; color: #ccc; letter-spacing: 1px; display: block; margin-bottom: -2px;">SISA</span>
                <span id="quotaText" style="font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: bold; color: #fff;">0</span>
            </div>
            
            <button class="btn-capture" onclick="jepretFoto()">
                <div class="inner-circle"></div>
            </button>
            
            <button class="btn-switch" onclick="tukarKamera()">🔄</button>
        </div>
    </div>

    <!-- SCREEN 3: GALERI -->
    <div id="galleryScreen" class="screen">
        <div class="gallery-header">
            <div>
                <h2 class="font-serif">Galeri <span id="galleryGuestName">Tamu</span></h2>
                <p style="color: var(--text-muted); font-size: 0.8rem;" id="galleryCount">Memuat...</p>
            </div>
            <button class="btn-primary" onclick="kembaliKeKamera()" style="padding: 10px 15px; font-size: 0.85rem;">+ Foto Lagi</button>
        </div>

        <div class="grid-gallery" id="guestGallery"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const IMGBB_API_KEY = "16a4714fa54ed030ef5416ae07a05f68";

        let eventId = new URLSearchParams(window.location.search).get('event');
        let eventData = null;
        let namaTamu = "";
        let deviceId = ""; // Variabel baru untuk melacak identitas HP tamu
        let sisaJepretan = 15;
        let jumlahFotoSaya = 0;
        let currentStream = null;
        let facingMode = "environment"; 
        let isDataLoaded = false; 

        // Fungsi membuat ID unik untuk perangkat jika belum ada
        function dapatkanAtauBuatDeviceId() {
            let id = localStorage.getItem(`tlcf_device_${eventId}`);
            if (!id) {
                // Generate ID unik acak berbasis waktu
                id = 'device_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem(`tlcf_device_${eventId}`, id);
            }
            return id;
        }

        window.onload = async () => {
            if(!eventId) return showError("Link tidak valid (ID Acara hilang).");
            
            deviceId = dapatkanAtauBuatDeviceId(); // Dapatkan identitas perangkat

            try {
                const doc = await db.collection("events").doc(eventId).get();
                if(!doc.exists) return showError("Acara tidak ditemukan.");
                
                eventData = doc.data();
                document.getElementById('cameraTopTitle').innerText = eventData.eventName;
                
                let formattedTitle = "";
                let namaAcaraTeks = eventData.eventName.replace('&', '<br>&');

                if(eventData.eventType === "Wedding") {
                    formattedTitle = `<span style="font-size: 1.1rem; font-weight: 300; font-family: 'Inter', sans-serif; opacity: 0.9;">The Wedding of</span><br>${namaAcaraTeks}`;
                } else if(eventData.eventType === "Birthday") {
                    formattedTitle = `<span style="font-size: 1.1rem; font-weight: 300; font-family: 'Inter', sans-serif; opacity: 0.9;">Celebrating the Birthday of</span><br>${namaAcaraTeks}`;
                } else {
                    formattedTitle = namaAcaraTeks;
                }
                document.getElementById('displayEventName').innerHTML = formattedTitle;

                let bgUrl = eventData.wallpaperUrl;
                if(!bgUrl || bgUrl === "") {
                    if(eventData.eventType === "Wedding") bgUrl = "https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80";
                    else if(eventData.eventType === "Birthday") bgUrl = "https://images.unsplash.com/photo-1530103862679-de3093126895?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80";
                    else bgUrl = "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80";
                }
                document.getElementById('welcomeScreen').style.backgroundImage = `url('${bgUrl}')`;

                sisaJepretan = eventData.guestPhotoLimit || 15;
                document.getElementById('loadingScreen').style.display = 'none';
                tampilkanScreen('welcomeScreen');
            } catch(e) {
                showError("Gagal menghubungi server.");
            }
        };

        function showError(msg) {
            document.getElementById('loadingText').innerText = msg;
            document.querySelector('.spinner').style.display = 'none';
        }

        function tampilkanScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        
        function kembaliKeWelcome() {
            matikanKamera();
            tampilkanScreen('welcomeScreen');
        }

        async function masukKamera() {
            const input = document.getElementById('guestNameInput').value.trim();
            if(!input) return alert("Tulis nama Anda terlebih dahulu!");
            
            namaTamu = input; // Nama tetap disimpan untuk admin/galeri

            if (!isDataLoaded) {
                await muatDataAwal();
                isDataLoaded = true; 
            }
            
            tampilkanScreen('cameraScreen');
            mulaiKamera();
        }

        async function mulaiKamera() {
            if(currentStream) currentStream.getTracks().forEach(t => t.stop());
            const video = document.getElementById('videoElement');
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 1920 } },
                    audio: false
                });
                video.srcObject = currentStream;
                if(facingMode === "user") video.classList.remove('no-mirror');
                else video.classList.add('no-mirror');
            } catch(e) {
                alert("Gagal mengakses kamera.");
            }
        }

        function tukarKamera() {
            facingMode = (facingMode === "user") ? "environment" : "user";
            mulaiKamera();
        }

        function matikanKamera() {
            if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        }

        function perbaruiUIRollFilm() {
            let sisa = sisaJepretan - jumlahFotoSaya;
            if (sisa < 0) sisa = 0;
            document.getElementById('quotaText').innerText = sisa;
        }

        function tambahKeFilmStrip(url) {
            const filmStrip = document.getElementById('filmStrip');
            const img = document.createElement('img');
            img.src = url;
            img.onclick = () => bukaLightbox(url); 
            filmStrip.insertBefore(img, filmStrip.firstChild); 
        }

        async function muatDataAwal() {
            try {
                // SEKARANG MENCARI FOTO BERDASARKAN DEVICE ID
                const snap = await db.collection("photos").where("eventId", "==", eventId).where("deviceId", "==", deviceId).get();
                
                let firestoreCount = snap.size;
                // Ambil cadangan perhitungan dari Local Storage browser berdasarkan device ID
                let localCount = parseInt(localStorage.getItem(`tlcf_count_${eventId}_${deviceId}`)) || 0;
                
                jumlahFotoSaya = Math.max(firestoreCount, localCount);
                perbaruiUIRollFilm();
                
                const filmStrip = document.getElementById('filmStrip');
                filmStrip.innerHTML = '';
                let photos = [];
                snap.forEach(doc => photos.push(doc.data()));
                photos.sort((a,b) => (a.timestamp ? a.timestamp.toMillis() : 0) - (b.timestamp ? b.timestamp.toMillis() : 0));
                
                photos.forEach(p => tambahKeFilmStrip(p.url));
            } catch(e) {}
        }

        async function jepretFoto() {
            if (jumlahFotoSaya >= sisaJepretan) return alert("Kuota foto Anda sudah habis!");
            
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            if (facingMode === "user") {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                const localUrl = URL.createObjectURL(blob);
                tambahKeFilmStrip(localUrl);
                
                jumlahFotoSaya++;
                perbaruiUIRollFilm();
                
                // KUNCI ANGKA HITUNGAN DI BROWSER BERDASARKAN DEVICE ID
                localStorage.setItem(`tlcf_count_${eventId}_${deviceId}`, jumlahFotoSaya);

                unggahDiLatarBelakang(blob);
            }, 'image/jpeg', 0.85);
        }

        async function unggahDiLatarBelakang(blob) {
            try {
                const formData = new FormData();
                formData.append("image", blob);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const result = await response.json();
                
                if(result.success) {
                    await db.collection("photos").add({
                        eventId: eventId,
                        guestName: namaTamu, // Nama tetap disimpan agar admin tahu
                        deviceId: deviceId, // Disimpan untuk pelacakan kuota akurat
                        url: result.data.url,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch(e) {
                console.error("Gagal menyimpan foto.", e);
            }
        }

        async function bukaGaleri() {
            matikanKamera();
            tampilkanScreen('galleryScreen');
            document.getElementById('galleryGuestName').innerText = namaTamu;
            const galeri = document.getElementById('guestGallery');
            galeri.innerHTML = '<p style="color:#888; grid-column:1/-1; text-align:center;">Memuat foto...</p>';

            try {
                let query = db.collection("photos").where("eventId", "==", eventId);
                // JIKA PRIVAT, HANYA TAMPILKAN FOTO DARI DEVICE ID INI
                if (eventData.privacy === 'private') query = query.where("deviceId", "==", deviceId);
                
                const snapshot = await query.get();
                galeri.innerHTML = '';
                if (snapshot.empty) {
                    galeri.innerHTML = '<p style="color:#888; grid-column:1/-1; text-align:center;">Belum ada foto.</p>';
                } else {
                    let photos = [];
                    snapshot.forEach(doc => photos.push(doc.data()));
                    photos.sort((a,b) => (b.timestamp ? b.timestamp.toMillis() : 0) - (a.timestamp ? a.timestamp.toMillis() : 0));
                    photos.forEach(p => {
                        galeri.innerHTML += `
                            <div class="photo-item" onclick="bukaLightbox('${p.url}')">
                                <img src="${p.url}" loading="lazy">
                                <button class="btn-lihat">Lihat</button>
                            </div>
                        `;
                    });
                }
            } catch(e) {
                galeri.innerHTML = '<p style="color:red; grid-column:1/-1;">Gagal memuat galeri.</p>';
            }
        }

        function kembaliKeKamera() {
            if (jumlahFotoSaya >= sisaJepretan) return alert("Kuota foto Anda sudah habis!");
            tampilkanScreen('cameraScreen');
            mulaiKamera();
        }

        function bukaLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function tutupLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightboxImg').src = '';
        }
    </script>
</body>
</html>
