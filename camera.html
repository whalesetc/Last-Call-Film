<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kamera Tamu • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-dark: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.55); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .camera-container { width: 100%; max-width: 400px; height: 80vh; max-height: 750px; border-radius: 24px; overflow: hidden; position: relative; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border-color); }
        .camera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)); z-index: 1; pointer-events: none; }
        
        .camera-content { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; }
        
        .event-title { font-size: 1.8rem; font-family: 'Playfair Display', serif; text-shadow: 0 2px 8px rgba(0,0,0,0.8); line-height: 1.2; margin-top: 10px; }
        .waiting-label { font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-weight: 600; }

        .shutter-area { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .shutter-btn { width: 75px; height: 75px; background: #fff; border-radius: 50%; border: 4px solid rgba(255,255,255,0.4); cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .shutter-btn:active { transform: scale(0.92); background: var(--accent); }

        .counter-badge { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; backdrop-filter: blur(5px); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: var(--bg-dark); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; width: 100%; max-width: 350px; text-align: center; }
        .form-control { width: 100%; padding: 12px; margin: 15px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; outline: none; text-align: center; font-size: 1rem; }
        .btn-primary { background: var(--accent); color: #000; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="camera-container" id="cameraBox" style="background-image: url('https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=600&q=80');">
        <div class="camera-overlay"></div>
        <div class="camera-content">
            <div>
                <p class="waiting-label" id="waitingText">The Wedding Of</p>
                <h1 class="event-title" id="eventTitle">Memuat Acara...</h1>
            </div>

            <div class="shutter-area">
                <div class="counter-badge" id="shotCounter">Sisa Jepretan: 0 / 0</div>
                <!-- Input kamera langsung menggunakan capture -->
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="prosesFotoJepret(event)">
                <button class="shutter-btn" onclick="triggerKamera()"></button>
            </div>
        </div>
    </div>

    <!-- MODAL NAMA TAMU -->
    <div class="modal" id="nameModal">
        <div class="modal-box">
            <h3 class="font-serif" style="margin-bottom: 5px;">Masukkan Nama Anda</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Sebelum mulai menjepret, siapa nama Anda?</p>
            <input type="text" id="guestNameInput" class="form-control" placeholder="Nama Tamu">
            <button class="btn-primary" onclick="simpanNamaTamu()">Mulai Menjepret</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const imgbbApiKey = "e260099c988d57272862b5d72290e82b";

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');

        let eventData = null;
        let guestName = localStorage.getItem('thelastcall_guest_name');
        let guestSessionId = localStorage.getItem('thelastcall_guest_id');

        if (!guestSessionId) {
            guestSessionId = 'guest_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('thelastcall_guest_id', guestSessionId);
        }

        async function initCamera() {
            if (!eventId) {
                alert("ID Acara tidak valid.");
                return;
            }

            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (!doc.exists) {
                    alert("Acara tidak ditemukan.");
                    return;
                }
                eventData = doc.data();
                document.getElementById('eventTitle').innerText = eventData.eventName;
                document.getElementById('waitingText').innerText = eventData.waitingText || "The Wedding Of";
                if (eventData.wallpaperUrl) {
                    document.getElementById('cameraBox').style.backgroundImage = `url('${eventData.wallpaperUrl}')`;
                }

                // Daftarkan tamu ke sub-koleksi guests jika belum ada
                await daftarKeAcara();
                hitungSisaJepretan();

            } catch (e) {
                console.error(e);
            }

            if (!guestName) {
                document.getElementById('nameModal').style.display = 'flex';
            }
        }

        async function daftarKeAcara() {
            if (!guestName) return;
            const guestRef = db.collection('events').doc(eventId).collection('guests').doc(guestSessionId);
            const doc = await guestRef.get();
            if (!doc.exists) {
                await guestRef.set({
                    name: guestName,
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        function simpanNamaTamu() {
            const val = document.getElementById('guestNameInput').value.trim();
            if (!val) return alert("Silakan masukkan nama Anda.");
            guestName = val;
            localStorage.setItem('thelastcall_guest_name', guestName);
            document.getElementById('nameModal').style.display = 'none';
            daftarKeAcara();
        }

        function triggerKamera() {
            if (!guestName) {
                document.getElementById('nameModal').style.display = 'flex';
                return;
            }
            document.getElementById('cameraInput').click();
        }

        async function hitungSisaJepretan() {
            const snapshot = await db.collection('photos')
                .where('eventId', '==', eventId)
                .where('guestId', '==', guestSessionId)
                .get();

            const limit = eventData.guestPhotoLimit || 15;
            const terpakai = snapshot.size;
            const sisa = Math.max(0, limit - terpakai);

            document.getElementById('shotCounter').innerText = `Sisa Jepretan: ${sisa} / ${limit}`;
            if (sisa <= 0) {
                document.getElementById('cameraInput').disabled = true;
            }
        }

        async function prosesFotoJepret(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Cek limit sebelum upload
            const snapshot = await db.collection('photos')
                .where('eventId', '==', eventId)
                .where('guestId', '==', guestSessionId)
                .get();

            const limit = eventData.guestPhotoLimit || 15;
            if (snapshot.size >= limit) {
                alert("Batas jepretan Anda untuk acara ini sudah habis.");
                return;
            }

            const btn = document.querySelector('.shutter-btn');
            btn.style.opacity = '0.5';

            try {
                const formData = new FormData();
                formData.append('image', file);
                
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, { method: 'POST', body: formData });
                const r = await res.json();
                
                if (!r.success) throw new Error("Gagal mengunggah foto.");

                // Simpan ke Firestore dengan menyertakan guestId agar album privat berfungsi
                await db.collection('photos').add({
                    eventId: eventId,
                    url: r.data.url,
                    guestName: guestName,
                    guestId: guestSessionId,
                    createdTime: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Foto berhasil diabadikan! 📸");
                hitungSisaJepretan();

            } catch (err) {
                alert("Terjadi kesalahan: " + err.message);
            } finally {
                btn.style.opacity = '1';
                event.target.value = ''; // Reset input file
            }
        }

        initCamera();
    </script>
</body>
</html>
