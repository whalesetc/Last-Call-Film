<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Last Call Film • Kamera Tamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-app: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.5); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-light); line-height: 1.6; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 420px; margin: 0 auto; position: relative; padding-bottom: 50px; }
        
        /* Header Kamera */
        .app-header { text-align: center; margin-bottom: 20px; }
        .app-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 600; margin-bottom: 4px; }
        .film-counter { display: inline-block; background: rgba(110, 231, 183, 0.15); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border: 1px solid rgba(110, 231, 183, 0.3); }

        /* Input Nama Tamu */
        .guest-input-box { margin-bottom: 16px; }
        .guest-input-box input { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border-color); font-size: 0.95rem; text-align: center; outline: none; background: rgba(255, 255, 255, 0.05); color: #fff; }
        .guest-input-box input:focus { border-color: var(--accent); }

        /* Jendela Viewfinder Kamera */
        .camera-wrapper { background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .camera-box { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 12px; overflow: hidden; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        /* Tombol Jepret */
        .btn-capture { width: 100%; padding: 16px; border: none; border-radius: 16px; background-color: #fff; color: #000; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: transform 0.1s; font-size: 0.9rem; }
        .btn-capture:active { transform: scale(0.97); }
        .btn-capture:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .status-msg { text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-top: 12px; }
        
        /* Galeri Foto Hasil Jepretan Tamu */
        .gallery-section-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 30px 0 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .gallery-item { background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 14px; border: 1px solid var(--border-color); text-align: center; display: flex; flex-direction: column; }
        .gallery-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .guest-tag { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.85rem; margin-bottom: 8px; color: rgba(255,255,255,0.9); }
        
        .btn-download { display: block; width: 100%; padding: 8px; background-color: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: 600; border-radius: 8px; margin-top: auto; transition: background 0.2s; }
        .btn-download:hover { background-color: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1 class="app-title font-serif">The Last Call</h1>
            <!-- Peringatan Sisa Rol Film -->
            <div class="film-counter" id="filmCounter">Sisa Rol: 15 / 15 Foto</div>
        </div>

        <div class="guest-input-box">
            <input type="text" id="namaTamuInput" placeholder="Ketik nama Anda di sini..." autocomplete="off">
        </div>

        <div class="camera-wrapper">
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="controls">
            <button class="btn-capture" id="captureBtn">Jepret Momen</button>
            <div id="status" class="status-msg">Siap merekam kenangan acaramu</div>
        </div>

        <h3 class="gallery-section-title font-serif">Hasil Jepretan Sesi Ini</h3>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1",
            measurementId: "G-31E0XP89W5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const galleryGrid = document.getElementById('galleryGrid');
        const namaTamuInput = document.getElementById('namaTamuInput');
        const filmCounter = document.getElementById('filmCounter');

        // Batas kuota rol film per sesi perangkat
        let sisaFilm = parseInt(localStorage.getItem('tlc_sisa_film')) || 15;
        updateCounterUI();

        function updateCounterUI() {
            filmCounter.innerText = `Sisa Rol: ${sisaFilm} / 15 Foto`;
            if(sisaFilm <= 0) {
                captureBtn.disabled = true;
                captureBtn.innerText = "Rol Film Habis";
                statusDiv.innerText = "Terima kasih! Rol film telah habis.";
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                statusDiv.innerText = "Gagal mengakses kamera perangkat.";
            }
        }
        initCamera();

        captureBtn.addEventListener('click', async () => {
            if (sisaFilm <= 0) return;

            const namaTamu = namaTamuInput.value.trim() || "Tamu Anonim";

            captureBtn.disabled = true;
            statusDiv.innerText = "Menyimpan foto...";
            
            video.style.opacity = '0';
            setTimeout(() => { video.style.opacity = '1'; }, 150);

            // Kompresi gambar agar cepat
            const MAX_WIDTH = 600;
            const scale = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6);

            // Kurangi kuota sisa film
            sisaFilm--;
            localStorage.setItem('tlc_sisa_film', sisaFilm);
            updateCounterUI();

            // Perbaikan Tombol Unduh (Langsung Memicu Download di Safari/Chrome)
            const namaFile = `TheLastCall_${namaTamu.replace(/\s+/g, '_')}_${Date.now()}.jpg`;
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${imageDataUrl}">
                <div class="guest-tag">${namaTamu}</div>
                <a href="${imageDataUrl}" download="${namaFile}" class="btn-download">Unduh Foto</a>
            `;
            galleryGrid.prepend(item);

            try {
                // Simpan ke database Firestore Admin
                await db.collection("photos").add({
                    url: imageDataUrl,
                    guestName: namaTamu,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                statusDiv.innerText = "Berhasil disimpan ke album acara!";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Gagal menyinkronkan ke server.";
            } finally {
                if(sisaFilm > 0) {
                    captureBtn.disabled = false;
                }
                setTimeout(() => { 
                    if(sisaFilm > 0) statusDiv.innerText = "Siap merekam kenangan acaramu"; 
                }, 2500);
            }
        });
    </script>
</body>
</html>
