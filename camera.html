<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kamera • The Last Call Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
        
        /* Top Navigation Bar */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .btn-album { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; text-decoration: none; backdrop-filter: blur(5px); cursor: pointer; }
        .event-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; text-align: center; flex: 1; margin: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* UI ROLL FILM MEKANIK */
        .roll-wrapper { display: flex; align-items: center; gap: 8px; }
        .roll-label { font-size: 0.6rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-align: right; line-height: 1.2; }
        .roll-container { 
            height: 50px; width: 45px; 
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; overflow: hidden; position: relative; 
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }
        .roll-numbers { 
            position: absolute; top: 10px; left: 0; width: 100%; 
            display: flex; flex-direction: column; align-items: center; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .roll-number { 
            height: 30px; line-height: 30px; font-family: 'Courier New', Courier, monospace; 
            font-size: 1rem; font-weight: bold; color: rgba(255,255,255,0.3); 
            transition: all 0.3s; 
        }

        /* Camera Viewfinder (PORTRAIT) */
        .camera-container { 
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center; 
            background: #111; overflow: hidden; margin-top: 60px; margin-bottom: 100px; 
            border-radius: 20px; width: 100%; max-width: 450px; margin-left: auto; margin-right: auto;
        }
        #cameraStream { width: 100%; height: 100%; object-fit: cover; }
        
        /* Frame Guide */
        .viewfinder-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 60%; border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        .viewfinder-guide::after { content: '+'; color: rgba(255,255,255,0.5); font-size: 2rem; font-weight: 300; }

        /* Flash Effect */
        #flashOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s ease-out; }

        /* Bottom Controls */
        .bottom-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; background: #000; padding: 0 20px; z-index: 10; }
        
        /* Capture Button */
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: transparent; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; padding: 0; }
        .capture-inner { width: 54px; height: 54px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .capture-btn:active .capture-inner { transform: scale(0.9); background: #ccc; }
        
        /* Disabled/Loading State */
        .capture-btn:disabled { border-color: #555; cursor: not-allowed; }
        .capture-btn:disabled .capture-inner { background: #555; }

        /* Flip Camera Button */
        .flip-btn { position: absolute; right: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); }

        /* Loading Screen Init */
        #initScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #outOfQuota { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 50; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="initScreen">
        <div class="loader"></div>
        <p style="color: #888; font-size: 0.9rem;">Menyiapkan Kamera...</p>
    </div>

    <div class="top-bar">
        <a href="#" id="linkAlbum" class="btn-album">Lihat Album</a>
        <div class="event-name" id="eventNameDisplay">Memuat...</div>
        
        <!-- UI Roll Mekanik -->
        <div class="roll-wrapper">
            <div class="roll-label">Sisa<br>Film</div>
            <div class="roll-container">
                <div class="roll-numbers" id="rollNumbers">
                    <!-- Angka akan diisi otomatis melalui JS -->
                </div>
            </div>
        </div>
    </div>

    <div class="camera-container">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="viewfinder-guide"></div>
        <div id="flashOverlay"></div>
        
        <div id="outOfQuota">
            <h2 class="font-serif" style="margin-bottom: 10px; color: #6ee7b7;">Film Habis!</h2>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">Kamu sudah menggunakan seluruh jatah foto. Silakan lihat hasilnya di album.</p>
            <button onclick="bukaAlbum()" style="background: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer;">Lihat Album Sekarang</button>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="capture-btn" id="btnCapture" onclick="ambilFoto()">
            <div class="capture-inner"></div>
        </button>
        <button class="flip-btn" onclick="balikKamera()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <polyline points="23 20 23 14 17 14"></polyline>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"></path>
                <path d="M3.51 15A9 9 0 0 0 18.36 18.36L23 14"></path>
            </svg>
        </button>
    </div>

    <!-- Canvas tersembunyi -->
    <canvas id="canvasHidden" style="display: none;"></canvas>

    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Variabel Global
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        let guestId = '';
        let fotoTerambil = 0;
        let batasFoto = 0;
        let antreanUpload = 0; // Melacak sisa foto yang sedang dikirim di background
        
        let stream = null;
        let facingMode = 'environment';
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('canvasHidden');
        const btnCapture = document.getElementById('btnCapture');

        // PERLINDUNGAN: Mencegah pindah ke album jika foto terakhir belum kelar di-upload
        document.getElementById('linkAlbum').addEventListener('click', function(e) {
            e.preventDefault();
            bukaAlbum();
        });

        // Inisialisasi
        async function initApp() {
            if (!eventId) { alert("Tautan tidak valid."); return; }

            const domain = window.location.href.split('?')[0].replace('camera.html', '').replace(/\/$/, '');
            document.getElementById('linkAlbum').href = `${domain}/album.html?event=${eventId}`;

            guestId = localStorage.getItem(`guest_${eventId}`);
            if (!guestId) {
                guestId = 'guest_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem(`guest_${eventId}`, guestId);
            }

            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (!doc.exists) { alert("Acara tidak ditemukan!"); return; }

                let currentEvent = doc.data();
                batasFoto = currentEvent.guestPhotoLimit || 15;
                document.getElementById('eventNameDisplay').innerText = currentEvent.eventName;

                const fotoSblmnya = localStorage.getItem(`count_${eventId}`);
                fotoTerambil = fotoSblmnya ? parseInt(fotoSblmnya) : 0;
                
                buatElemenRollFilm();
                perbaruiUI();
                await mulaiKamera();

                document.getElementById('initScreen').style.display = 'none';

            } catch (error) {
                alert("Gagal memuat data: " + error.message);
            }
        }

        function buatElemenRollFilm() {
            const container = document.getElementById('rollNumbers');
            container.innerHTML = '';
            for (let i = batasFoto; i >= 0; i--) {
                const numDiv = document.createElement('div');
                numDiv.className = 'roll-number';
                numDiv.innerText = i;
                container.appendChild(numDiv);
            }
        }

        function perbaruiUI() {
            const numbers = document.querySelectorAll('.roll-number');
            const activeIndex = fotoTerambil;

            numbers.forEach((el, idx) => {
                if (idx === activeIndex) {
                    el.style.color = '#fff';
                    el.style.fontSize = '1.3rem';
                    el.style.opacity = '1';
                } else {
                    el.style.color = 'rgba(255,255,255,0.3)';
                    el.style.fontSize = '1rem';
                    el.style.opacity = '0.5';
                }
            });

            const offset = fotoTerambil * -30;
            document.getElementById('rollNumbers').style.transform = `translateY(${offset}px)`;

            if (fotoTerambil >= batasFoto) {
                btnCapture.disabled = true;
                document.getElementById('outOfQuota').style.display = 'flex';
                if(stream) stream.getTracks().forEach(track => track.stop());
            }
        }

        async function mulaiKamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) { alert("Izinkan akses kamera di browser Anda."); }
        }

        function balikKamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            mulaiKamera();
        }

        async function ambilFoto() {
            if (fotoTerambil >= batasFoto) return;
            
            btnCapture.disabled = true;

            const flash = document.getElementById('flashOverlay');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            if(facingMode === 'user') {
                ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Update UI langsung
            fotoTerambil++;
            localStorage.setItem(`count_${eventId}`, fotoTerambil);
            perbaruiUI();

            setTimeout(() => {
                if(fotoTerambil < batasFoto) btnCapture.disabled = false;
            }, 400);

            // PROSES UPLOAD
            antreanUpload++; 
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
                const formData = new FormData();
                formData.append('image', blob);

                const uploadRes = await fetch('https://api.imgbb.com/1/upload?key=16a4714fa54ed030ef5416ae07a05f68', {
                    method: 'POST', body: formData
                });
                const uploadData = await uploadRes.json();
                
                if (uploadData.success) {
                    // DIKEMBALIKAN KE JALUR DATABASE YANG BENAR
                    await db.collection('photos').add({
                        eventId: eventId,
                        guestId: guestId,
                        url: uploadData.data.url,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch (err) {
                console.error("Gagal upload:", err);
            } finally {
                antreanUpload--;
            }
        }

        function bukaAlbum() {
            // Cegah pindah halaman jika foto masih dikirim ke server
            if (antreanUpload > 0) {
                alert("Tunggu sebentar ya, foto terakhir sedang disimpan...");
                return;
            }
            window.location.href = document.getElementById('linkAlbum').href;
        }

        initApp();
    </script>
</body>
</html>
