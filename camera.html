<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Last Call Film • Kamera</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-app: #12110f; --text-light: #ffffff; --text-muted: rgba(255, 255, 255, 0.7); --accent: #6ee7b7; --border-color: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-app); color: var(--text-light); line-height: 1.6; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; position: relative; }
        #bgOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; backdrop-filter: blur(10px); }
        
        .app-container { width: 100%; max-width: 480px; margin: 0 auto; position: relative; z-index: 1; display: none; }
        #messageScreen, #introScreen { text-align: center; margin-top: 10vh; padding: 30px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); border-radius: 20px; backdrop-filter: blur(10px); }
        .intro-title { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 10px; line-height: 1.2; }
        .intro-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; text-align: center; margin-bottom: 20px; outline: none; }
        .intro-input:focus { border-color: var(--accent); }
        
        .btn-primary { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-outline { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border-color); border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px);}
        
        .album-header { margin-bottom: 25px; margin-top: 10px; text-align: center; }
        .album-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 600; margin-bottom: 8px; line-height: 1.2; }
        .dashboard-card { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 30px; text-align: center; }
        
        .retro-counter { font-family: 'Courier Prime', monospace; background: #111; color: #e5e5e5; padding: 8px 16px; border: 2px solid #333; border-radius: 6px; font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; box-shadow: inset 0px 4px 10px rgba(0,0,0,0.9), 0 2px 4px rgba(255,255,255,0.1); display: inline-flex; align-items: center; gap: 8px; }
        .retro-counter span { background: #000; padding: 2px 6px; border-radius: 4px; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); box-shadow: inset 0 0 5px rgba(255,255,255,0.1); }
        
        .camera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .camera-wrapper { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .camera-box { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 12px; overflow: hidden; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        .status-msg { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 15px; }

        .gallery-section-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 30px 0 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding-bottom: 40px; }
        .gallery-item { background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; }
        .gallery-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #222; cursor: pointer; transition: 0.2s; }
        .gallery-item img:active { transform: scale(0.95); }
        
        .action-group { display: flex; gap: 6px; margin-top: auto; }
        .btn-action { flex: 1; padding: 8px 0; background-color: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 0.7rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-action:active { transform: scale(0.9); }
        .btn-delete { background-color: rgba(255, 60, 60, 0.15); color: #ff6b6b; border-color: rgba(255, 60, 60, 0.3); }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease; }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox img { max-width: 100%; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #lightboxClose { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2.5rem; background: none; border: none; cursor: pointer; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .uploading-overlay { position: absolute; top: 10px; left: 10px; right: 10px; bottom: 45px; background: rgba(0,0,0,0.6); border-radius: 8px; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 2; pointer-events: none; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--accent); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin-bottom: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="bgOverlay"></div>

    <div class="app-container" id="messageScreen" style="display: flex; flex-direction: column;">
        <h2 class="font-serif" id="msgTitle">Memuat Acara...</h2>
        <p id="msgDesc" style="color: var(--text-muted); margin-top: 10px;">Mohon tunggu sebentar.</p>
    </div>

    <div class="app-container" id="introScreen">
        <h1 class="intro-title" id="introEventTitle">Nama Acara</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;">Masukkan nama Anda untuk masuk ke album acara ini. 1 nama = 1 akses tamu.</p>
        <input type="text" id="namaTamuInput" class="intro-input" placeholder="Ketik nama Anda di sini..." autocomplete="off">
        <button class="btn-primary" id="btnStartSession" onclick="mulaiSesiTamu()">Masuk ke Album</button>
    </div>

    <div class="app-container" id="guestDashboardScreen">
        <div class="album-header">
            <h1 class="album-title" id="dashEventTitle">Acara</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted);" id="dashGuestName">Tamu: -</p>
        </div>
        <div class="dashboard-card">
            <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">Sisa Roll Film Anda</h3>
            <div class="retro-counter" style="margin-bottom: 20px; font-size: 2rem;">
                <span id="dashSisaFoto">00</span>
            </div>
            <button class="btn-primary" id="btnBukaKamera" onclick="bukaLayarKamera()">Buka Kamera Saya</button>
        </div>
        <h3 class="gallery-section-title">Album <span id="privacyLabelText" style="font-size:0.8rem; font-family:'Inter', sans-serif; font-weight:normal; color:var(--text-muted); float:right; margin-top:5px;"></span></h3>
        <div class="gallery-grid" id="albumGalleryGrid"></div>
    </div>

    <div class="app-container" id="cameraScreen" style="padding-bottom: 30px;">
        <div class="camera-header">
            <button class="btn-outline" style="width: auto; padding: 8px 16px; font-size:0.85rem;" onclick="kembaliKeAlbum()">&larr; Album</button>
            <div class="retro-counter">
                EXP: <span id="filmCounter">00</span>
            </div>
        </div>
        <div class="camera-wrapper">
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>
        <div class="controls">
            <button class="btn-primary" id="captureBtn" onclick="jepretDanUnggahLatar()">Jepret</button>
            <div id="status" class="status-msg">Ketuk jepret, foto akan langsung tersimpan.</div>
        </div>
        <h3 class="gallery-section-title" style="margin-top: 40px;">Riwayat Jepretan Anda</h3>
        <div class="gallery-grid" id="cameraGalleryGrid"></div>
    </div>

    <div id="lightbox" onclick="tutupLightbox()">
        <button id="lightboxClose">&times;</button>
        <img id="lightboxImg" src="" alt="Preview">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            storageBucket: "the-last-call-film.firebasestorage.app",
            messagingSenderId: "665352445108",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');

        let eventData = null, sessionId = null, shotsTaken = 0, maxShots = 15, namaTamuGlobal = "Tamu";
        let videoStream = null;
        let pendingUploads = 0;
        
        // MEMORI LATAR BELAKANG: Menghindari layar hitam saat klik "Lihat"
        window.dataGaleriGlobal = {};
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');

        window.addEventListener('beforeunload', (e) => {
            if (pendingUploads > 0) {
                e.preventDefault();
                e.returnValue = 'Ada foto yang masih dalam proses unggah. Yakin ingin keluar? Foto mungkin tidak tersimpan.';
            }
        });

        async function loadEventData() {
            if (!eventId) return tampilkanPesan("Tautan Tidak Valid", "Pindai QR Code dari undangan yang benar.");
            try {
                const doc = await db.collection("events").doc(eventId).get();
                if (!doc.exists) return tampilkanPesan("Acara Tidak Ditemukan", "Acara ini mungkin telah dihapus.");
                eventData = doc.data();
                if (eventData.status !== "Aktif") return tampilkanPesan("Kamera Terkunci", "Acara ini belum diaktifkan oleh pemilik.");
                if (eventData.wallpaperUrl) document.body.style.backgroundImage = `url(${eventData.wallpaperUrl})`;

                let judul = eventData.eventType === "Wedding" ? `Wedding of<br>${eventData.eventName}` : (eventData.eventType === "Birthday" ? `Birthday of<br>${eventData.eventName}` : eventData.eventName);
                document.getElementById('introEventTitle').innerHTML = judul;
                document.getElementById('dashEventTitle').innerHTML = judul;
                document.getElementById('privacyLabelText').innerText = eventData.privacy === 'visible' ? "(Publik)" : "(Privat)";
                maxShots = eventData.guestPhotoLimit || 15;

                sessionId = localStorage.getItem('tlc_session_' + eventId);
                if (sessionId) await lanjutkanSesi();
                else {
                    document.getElementById('messageScreen').style.display = 'none';
                    document.getElementById('introScreen').style.display = 'block';
                }
            } catch (error) {
                tampilkanPesan("Koneksi Gagal", "Periksa jaringan internet Anda.");
            }
        }

        function tampilkanPesan(judul, deskripsi) {
            document.querySelectorAll('.app-container').forEach(el => el.style.display = 'none');
            document.getElementById('messageScreen').style.display = 'flex';
            document.getElementById('msgTitle').innerText = judul;
            document.getElementById('msgDesc').innerText = deskripsi;
        }

        async function mulaiSesiTamu() {
            const nama = document.getElementById('namaTamuInput').value.trim();
            if(!nama) return alert('Silakan masukkan nama Anda terlebih dahulu!');
            const btn = document.getElementById('btnStartSession');
            btn.disabled = true; btn.innerText = "Memeriksa Kuota...";

            try {
                const doc = await db.collection("events").doc(eventId).get();
                const currentData = doc.data();
                if (currentData.quota !== 9999 && currentData.remainingQuota <= 0) {
                    btn.innerText = "Masuk ke Album"; btn.disabled = false;
                    return alert("Maaf, kuota jumlah tamu untuk acara ini telah penuh.");
                }
                if (currentData.quota !== 9999) {
                    await db.collection("events").doc(eventId).update({ remainingQuota: firebase.firestore.FieldValue.increment(-1) });
                }
                sessionId = 'GUEST_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                localStorage.setItem('tlc_session_' + eventId, sessionId);
                namaTamuGlobal = nama;

                await db.collection("guest_sessions").doc(sessionId).set({ eventId: eventId, guestName: nama, shotsTaken: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                shotsTaken = 0; bukaDasborAlbum();
            } catch (error) {
                alert("Gagal terhubung. Coba lagi."); btn.disabled = false; btn.innerText = "Masuk ke Album";
            }
        }

        async function lanjutkanSesi() {
            try {
                const sessionDoc = await db.collection("guest_sessions").doc(sessionId).get();
                if(sessionDoc.exists) { shotsTaken = sessionDoc.data().shotsTaken || 0; namaTamuGlobal = sessionDoc.data().guestName || "Tamu"; }
                else shotsTaken = 0;
                bukaDasborAlbum();
            } catch(e) {
                shotsTaken = parseInt(localStorage.getItem('tlc_shots_' + eventId)) || 0; bukaDasborAlbum();
            }
        }

        function formatAngkaRetro(angka) { return angka < 10 ? '0' + angka : angka; }

        function bukaDasborAlbum() {
            document.querySelectorAll('.app-container').forEach(el => el.style.display = 'none');
            document.getElementById('guestDashboardScreen').style.display = 'block';
            document.getElementById('dashGuestName').innerText = `Tamu: ${namaTamuGlobal}`;
            updateSisaUI(); muatGaleriUtama('albumGalleryGrid');
        }

        async function bukaLayarKamera() {
            if (maxShots - shotsTaken <= 0) return alert("Maaf, batas jepretan Anda telah habis.");
            document.querySelectorAll('.app-container').forEach(el => el.style.display = 'none');
            document.getElementById('cameraScreen').style.display = 'block';
            updateSisaUI(); statusDiv.innerText = "Ketuk jepret, foto akan langsung tersimpan.";

            try {
                // Resolusi Optimal Full HD
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                video.srcObject = videoStream;
            } catch (err) { statusDiv.innerText = "Gagal mengakses kamera. Berikan izin di browser Anda."; }
            muatGaleriPribadi('cameraGalleryGrid');
        }

        function kembaliKeAlbum() {
            if (videoStream) videoStream.getTracks().forEach(track => track.stop());
            bukaDasborAlbum();
        }

        function updateSisaUI() {
            const sisa = maxShots - shotsTaken;
            const strSisa = formatAngkaRetro(sisa);
            document.getElementById('dashSisaFoto').innerText = strSisa;
            document.getElementById('filmCounter').innerText = strSisa;
            
            const btnDash = document.getElementById('btnBukaKamera');
            if(sisa <= 0) {
                btnDash.disabled = true; btnDash.innerText = "Roll Habis";
                captureBtn.disabled = true; captureBtn.innerText = "Roll Habis";
            } else {
                btnDash.disabled = false; btnDash.innerText = "Buka Kamera Saya";
                captureBtn.disabled = false; captureBtn.innerText = "Jepret";
            }
        }

        async function fetchWithRetry(url, options, retries = 2) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, options);
                    const result = await response.json();
                    if (result.success) return result;
                    throw new Error("API Gagal");
                } catch (err) {
                    if (i === retries) throw err;
                }
            }
        }

        async function jepretDanUnggahLatar() {
            if ((maxShots - shotsTaken) <= 0) return;
            
            // Batas Full HD (1920px) - Gambar tajam tapi ukuran file aman untuk ImgBB
            const MAX_DIMENSION = 1920; 
            let width = video.videoWidth;
            let height = video.videoHeight;
            if (width > height) {
                if (width > MAX_DIMENSION) { height = Math.round((height * MAX_DIMENSION) / width); width = MAX_DIMENSION; }
            } else {
                if (height > MAX_DIMENSION) { width = Math.round((width * MAX_DIMENSION) / height); height = MAX_DIMENSION; }
            }
            
            canvas.width = width; 
            canvas.height = height;
            canvas.getContext('2d').drawImage(video, 0, 0, width, height);
            
            video.style.opacity = '0'; setTimeout(() => { video.style.opacity = '1'; }, 150);

            // Kualitas kompresi 90% (Sangat jernih)
            const localDataUrl = canvas.toDataURL('image/jpeg', 0.90);
            const base64Image = localDataUrl.split(',')[1];

            shotsTaken++; 
            localStorage.setItem('tlc_shots_' + eventId, shotsTaken);
            updateSisaUI();
            
            const tempId = 'temp_' + Date.now();
            tambahPlaceholderUI(tempId, localDataUrl);

            pendingUploads++;
            prosesUploadDiLatar(base64Image, tempId, localDataUrl);
        }

        async function prosesUploadDiLatar(base64Data, tempId, localDataUrl) {
            try {
                // Upload ke ImgBB
                const formData = new FormData(); 
                formData.append('key', '16a4714fa54ed030ef5416ae07a05f68'); 
                formData.append('image', base64Data);
                
                const result = await fetchWithRetry('https://api.imgbb.com/1/upload', { method: 'POST', body: formData }, 2);

                const docRef = await db.collection("photos").add({ 
                    eventId: eventId, 
                    url: result.data.url,
                    guestName: namaTamuGlobal, 
                    sessionId: sessionId, 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                });
                
                await db.collection("guest_sessions").doc(sessionId).update({ 
                    shotsTaken: firebase.firestore.FieldValue.increment(1) 
                });
                
                ubahPlaceholderMenjadiAsli(tempId, docRef.id, result.data.url, localDataUrl, namaTamuGlobal);
                
            } catch (error) {
                // Langsung batalkan dan kembalikan kuota jika ImgBB error
                gagalUpload(tempId);
            } finally {
                pendingUploads--;
            }
        }

        function tambahPlaceholderUI(tempId, localDataUrl) {
            const galleryDiv = document.getElementById('cameraGalleryGrid');
            if(galleryDiv.innerHTML.includes('Belum ada jepretan')) galleryDiv.innerHTML = '';

            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.id = tempId;
            
            const overlay = document.createElement('div');
            overlay.className = 'uploading-overlay';
            overlay.innerHTML = '<div class="spinner"></div><div style="font-size:0.7rem; color:#fff; font-weight:bold;">Menyimpan...</div>';
            item.appendChild(overlay);

            const img = document.createElement('img');
            img.src = localDataUrl;
            img.style = "opacity:0.6; filter: grayscale(40%); pointer-events:none;";
            item.appendChild(img);

            const nameDiv = document.createElement('div');
            nameDiv.style = "font-family:'Playfair Display', serif; font-size:0.8rem; margin-bottom:8px; text-align:center;";
            nameDiv.innerText = namaTamuGlobal;
            item.appendChild(nameDiv);

            const act = document.createElement('div');
            act.className = 'action-group';
            act.innerHTML = `
                <button class="btn-action" disabled style="background:rgba(255,255,255,0.05); color:#888;">Lihat</button>
                <button class="btn-action" disabled style="background:rgba(255,255,255,0.05); color:#888;">Unduh</button>
                <button class="btn-action" disabled style="background:rgba(255,255,255,0.05); color:#888;">Hapus</button>
            `;
            item.appendChild(act);
            
            galleryDiv.prepend(item);
        }

        function ubahPlaceholderMenjadiAsli(tempId, docId, realUrl, localDataUrl, guestName) {
            const item = document.getElementById(tempId);
            if(!item) return;
            
            // Simpan URL ke memori agar DOM HTML tidak kelebihan beban teks (Anti Layar Hitam)
            window.dataGaleriGlobal[docId] = { url: realUrl, guestName: guestName };
            
            item.innerHTML = '';
            item.removeAttribute('id');

            const img = document.createElement('img');
            img.src = localDataUrl || realUrl;
            img.onerror = () => { img.src = 'https://via.placeholder.com/300x400/111111/ffffff?text=Image+Error'; };
            img.onclick = () => lihatFotoAman(docId);
            item.appendChild(img);

            const nameDiv = document.createElement('div');
            nameDiv.style = "font-family:'Playfair Display', serif; font-size:0.8rem; margin-bottom:8px; text-align:center;";
            nameDiv.innerText = namaTamuGlobal;
            item.appendChild(nameDiv);

            const actionGroup = document.createElement('div');
            actionGroup.className = 'action-group';

            const btnView = document.createElement('button');
            btnView.className = 'btn-action';
            btnView.innerText = 'Lihat';
            btnView.onclick = () => lihatFotoAman(docId);
            actionGroup.appendChild(btnView);

            const btnUnduh = document.createElement('button');
            btnUnduh.className = 'btn-action';
            btnUnduh.innerText = 'Unduh';
            btnUnduh.onclick = () => unduhFotoAman(docId);
            actionGroup.appendChild(btnUnduh);

            const btnHapus = document.createElement('button');
            btnHapus.className = 'btn-action btn-delete';
            btnHapus.innerText = 'Hapus';
            btnHapus.onclick = function() { hapusFoto(docId, this); };
            actionGroup.appendChild(btnHapus);

            item.appendChild(actionGroup);
        }

        function gagalUpload(tempId) {
            const item = document.getElementById(tempId);
            if(item) item.remove();
            
            shotsTaken--;
            localStorage.setItem('tlc_shots_' + eventId, shotsTaken);
            updateSisaUI();
            alert("Gagal mengunggah foto karena ukuran terlalu besar atau koneksi terputus. Jatah film dikembalikan.");
        }

        async function hapusFoto(docId, btnElement) {
            if(!confirm('Hapus foto ini? 1 Roll jepretan akan dikembalikan ke kamera Anda.')) return;
            btnElement.disabled = true; btnElement.innerText = "Hapus...";
            try {
                await db.collection("photos").doc(docId).delete();
                await db.collection("guest_sessions").doc(sessionId).update({ shotsTaken: firebase.firestore.FieldValue.increment(-1) });
                shotsTaken--; localStorage.setItem('tlc_shots_' + eventId, shotsTaken);
                updateSisaUI();
                btnElement.closest('.gallery-item').remove();
            } catch (error) {
                alert("Gagal menghapus."); btnElement.disabled = false; btnElement.innerText = "Hapus";
            }
        }

        async function muatGaleriUtama(elementId) {
            const galleryDiv = document.getElementById(elementId);
            galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:0.8rem;">Memuat album...</div>';
            try {
                let query = db.collection("photos").where("eventId", "==", eventId);
                if (eventData.privacy === "private") query = query.where("sessionId", "==", sessionId);
                const snapshot = await query.get();
                if(snapshot.empty) return galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:0.8rem; padding:20px; border:1px dashed var(--border-color); border-radius:12px;">Album masih kosong.</div>';
                let photos = []; snapshot.forEach(doc => { let data = doc.data(); data.id = doc.id; photos.push(data); });
                photos.sort((a, b) => (b.timestamp ? b.timestamp.toMillis() : 0) - (a.timestamp ? a.timestamp.toMillis() : 0));
                renderGaleriHTML(photos, galleryDiv);
            } catch(e) { galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">Gagal memuat foto.</div>'; }
        }

        async function muatGaleriPribadi(elementId) {
            const galleryDiv = document.getElementById(elementId);
            galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:0.8rem;">Memuat riwayat...</div>';
            try {
                let query = db.collection("photos").where("eventId", "==", eventId).where("sessionId", "==", sessionId);
                const snapshot = await query.get();
                if(snapshot.empty) return galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:0.8rem; padding:20px;">Belum ada jepretan Anda.</div>';
                let photos = []; snapshot.forEach(doc => { let data = doc.data(); data.id = doc.id; photos.push(data); });
                photos.sort((a, b) => (b.timestamp ? b.timestamp.toMillis() : 0) - (a.timestamp ? a.timestamp.toMillis() : 0));
                renderGaleriHTML(photos, galleryDiv);
            } catch(e) { galleryDiv.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">Gagal memuat.</div>'; }
        }

        function renderGaleriHTML(photos, galleryDiv) {
            galleryDiv.innerHTML = '';
            photos.forEach(photo => {
                // Simpan URL di memori RAM
                window.dataGaleriGlobal[photo.id] = { url: photo.url, guestName: photo.guestName };
                
                const item = document.createElement('div');
                item.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = photo.url;
                img.onerror = () => { img.src = 'https://via.placeholder.com/300x400/222222/6ee7b7?text=Foto+Aman'; };
                img.onclick = () => lihatFotoAman(photo.id);
                item.appendChild(img);

                const nameDiv = document.createElement('div');
                nameDiv.style = "font-family:'Playfair Display', serif; font-size:0.8rem; margin-bottom:8px; text-align:center;";
                nameDiv.innerText = photo.guestName;
                item.appendChild(nameDiv);

                const actionGroup = document.createElement('div');
                actionGroup.className = 'action-group';

                const btnView = document.createElement('button');
                btnView.className = 'btn-action';
                btnView.innerText = 'Lihat';
                btnView.onclick = () => lihatFotoAman(photo.id);
                actionGroup.appendChild(btnView);

                const btnUnduh = document.createElement('button');
                btnUnduh.className = 'btn-action';
                btnUnduh.innerText = 'Unduh';
                btnUnduh.onclick = () => unduhFotoAman(photo.id);
                actionGroup.appendChild(btnUnduh);

                if (photo.sessionId === sessionId) {
                    const btnHapus = document.createElement('button');
                    btnHapus.className = 'btn-action btn-delete';
                    btnHapus.innerText = 'Hapus';
                    btnHapus.onclick = function() { hapusFoto(photo.id, this); };
                    actionGroup.appendChild(btnHapus);
                }

                item.appendChild(actionGroup);
                galleryDiv.appendChild(item);
            });
        }

        function lihatFotoAman(id) {
            const data = window.dataGaleriGlobal[id];
            if(!data) return;
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = data.url;
            document.getElementById('lightbox').classList.add('show');
        }

        function tutupLightbox() {
            document.getElementById('lightbox').classList.remove('show');
            setTimeout(() => { document.getElementById('lightboxImg').src = ""; }, 300);
        }

        async function unduhFotoAman(id) {
            const data = window.dataGaleriGlobal[id];
            if(!data) return;
            const fileName = `TLC_${data.guestName.replace(/\s+/g, '_')}_${Date.now()}.jpg`;

            try {
                const response = await fetch(data.url);
                const blob = await response.blob();
                
                // Native Share iOS (Solusi untuk iPad/iPhone)
                if (navigator.share && navigator.canShare) {
                    const file = new File([blob], fileName, { type: 'image/jpeg' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'The Last Call Photo' });
                        return; 
                    }
                }

                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);

            } catch (e) {
                window.open(data.url, '_blank');
            }
        }

        loadEventData();
    </script>
</body>
</html>
