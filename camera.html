<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Last Call Film • Kamera Tamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #000; color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #loadingText { margin-top: 20px; font-family: 'Playfair Display', serif; font-size: 1.5rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #6ee7b7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #000; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .event-name { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px;}
        .film-counter { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .btn-album { background: rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.2s;}
        
        #statusBar { background-color: #ef4444; color: #fff; text-align: center; padding: 8px; font-size: 0.8rem; font-weight: bold; display: none; width: 100%; z-index: 9; }
        
        /* Indikator Latar Belakang */
        #uploadIndicator { background-color: #3b82f6; color: #fff; text-align: center; padding: 6px; font-size: 0.75rem; font-weight: 600; display: none; width: 100%; z-index: 9; }

        .camera-wrapper { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 15px 20px; background: #111; }
        .camera-container { height: 100%; max-width: 100%; aspect-ratio: 3 / 4; background: #000; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .viewfinder-frame { position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%; border: 1px solid rgba(255,255,255,0.25); pointer-events: none; z-index: 5; border-radius: 8px; }
        .viewfinder-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; pointer-events: none; z-index: 5; }
        .viewfinder-crosshair::before { content:''; position:absolute; top:11px; left:0; width:24px; height:2px; background:rgba(255,255,255,0.6); }
        .viewfinder-crosshair::after { content:''; position:absolute; top:0; left:11px; width:2px; height:24px; background:rgba(255,255,255,0.6); }

        #flashEffect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out; z-index: 20; }
        .flash-active { opacity: 1 !important; }

        .bottom-area { background: #000; display: flex; flex-direction: column; padding: 15px 20px 25px; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .main-controls { display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }

        .btn-capture { width: 70px; height: 70px; border-radius: 50%; background: transparent; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; transition: transform 0.1s; }
        .btn-capture-inner { width: 54px; height: 54px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .btn-capture:active .btn-capture-inner { background: #ccc; transform: scale(0.9); }
        .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; border-color: rgba(255,255,255,0.5); }
        .btn-capture:disabled .btn-capture-inner { background: rgba(255,255,255,0.5); }

        .btn-switch { position: absolute; right: 0; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; color: #fff; font-size: 1.2rem; }
        
        .thumbnail-gallery { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; width: 100%; }
        .thumbnail-btn { width: 42px; height: 42px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; cursor: pointer; background: #222; transition: 0.2s; position: relative; }
        .thumbnail-btn:active { transform: scale(0.9); border-color: #6ee7b7; }
        
        #previewModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #previewImage { max-width: 100%; max-height: 70vh; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); object-fit: contain; }
        .preview-actions { display: flex; gap: 15px; width: 100%; max-width: 350px; }
        .btn-close-modal { flex: 1; padding: 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .btn-save-modal { flex: 2; padding: 14px; background: #6ee7b7; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <div id="loadingText">Menyiapkan Kamera...</div>
    </div>

    <div class="header">
        <a href="#" id="btnToAlbum" class="btn-album">Lihat Album</a>
        <div class="event-name" id="displayEventName">Memuat...</div>
        <div class="film-counter" id="displayFilmCounter">-- / --</div>
    </div>

    <div id="statusBar">🔴 MODE DEMO - Foto tidak masuk ke album</div>
    <div id="uploadIndicator">Mengirim <span id="pendingCount">0</span> foto ke album...</div>

    <div class="camera-wrapper">
        <div class="camera-container">
            <video id="cameraFeed" autoplay playsinline></video>
            <div class="viewfinder-frame"></div>
            <div class="viewfinder-crosshair"></div>
            <div id="flashEffect"></div>
        </div>
    </div>

    <div class="bottom-area">
        <div class="main-controls">
            <button class="btn-capture" id="btnCapture" onclick="jepretFoto()">
                <div class="btn-capture-inner"></div>
            </button>
            <button class="btn-switch" onclick="tukarKamera()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.44-5.44"></path></svg>
            </button>
        </div>

        <div class="thumbnail-gallery" id="thumbnailGallery"></div>
    </div>

    <div id="previewModal">
        <img id="previewImage" src="">
        <div class="preview-actions">
            <button class="btn-close-modal" onclick="tutupPreview()">Tutup</button>
            <button class="btn-save-modal" onclick="simpanFotoManual()">Simpan ke HP</button>
        </div>
    </div>

    <canvas id="photoCanvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkU02LCtMx-KAhsjLPmSsR0ZEs-jVlyHI",
            authDomain: "the-last-call-film.firebaseapp.com",
            projectId: "the-last-call-film",
            appId: "1:665352445108:web:3ae79656e3dfcb22254be1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let eventId = null;
        let eventData = null;
        let isDemoMode = false;
        let maxPhotos = 15;
        let photosTaken = 0;
        let currentPhotoDataUrl = null; 
        
        let videoStream = null;
        let currentFacingMode = 'environment';
        
        // Variabel untuk melacak antrean upload latar belakang
        let pendingUploads = 0;

        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('photoCanvas');
        const btnCapture = document.getElementById('btnCapture');
        const thumbnailGallery = document.getElementById('thumbnailGallery');
        const uploadIndicator = document.getElementById('uploadIndicator');
        const pendingCountDisplay = document.getElementById('pendingCount');

        // Mencegah tamu menutup browser saat masih ada foto yang dikirim
        window.addEventListener('beforeunload', function (e) {
            if (pendingUploads > 0) {
                const msg = 'Masih ada foto yang sedang dikirim ke album. Yakin ingin keluar?';
                e.returnValue = msg;
                return msg;
            }
        });

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            eventId = urlParams.get('event');

            if (!eventId) {
                alert("Tautan kamera tidak valid.");
                document.getElementById('loadingText').innerText = "Tautan Tidak Valid";
                return;
            }

            document.getElementById('btnToAlbum').href = `album.html?event=${eventId}`;
            await muatDataAcara();
            await mulaiKamera();
        };

        async function muatDataAcara() {
            try {
                const doc = await db.collection('events').doc(eventId).get();
                if (!doc.exists) {
                    alert("Acara tidak ditemukan!");
                    return;
                }

                eventData = doc.data();
                document.getElementById('displayEventName').innerText = eventData.eventName;
                maxPhotos = eventData.guestPhotoLimit || 15;

                const storageKey = `lastcall_${eventId}_count`;
                photosTaken = parseInt(localStorage.getItem(storageKey)) || 0;
                
                const waktuSekarang = new Date();
                const startDateTime = new Date(`${eventData.date}T${eventData.startTime || '00:00'}:00`);
                const endDateTime = new Date(`${eventData.date}T${eventData.endTime || '23:59'}:59`);

                if (waktuSekarang < startDateTime || waktuSekarang > endDateTime) {
                    isDemoMode = true;
                    document.getElementById('statusBar').style.display = 'block';
                    document.getElementById('displayFilmCounter').innerText = `DEMO`;
                } else {
                    isDemoMode = false;
                    perbaruiTampilanRoll();
                }

                setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; }, 1000);

            } catch (error) {
                console.error("Error:", error);
                alert("Gagal memuat data acara.");
            }
        }

        function perbaruiTampilanRoll() {
            if (isDemoMode) return;
            const sisa = maxPhotos - photosTaken;
            document.getElementById('displayFilmCounter').innerText = `${sisa} / ${maxPhotos}`;
            if (sisa <= 0) {
                btnCapture.disabled = true;
            }
        }

        async function mulaiKamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: currentFacingMode, width: { ideal: 1080 }, height: { ideal: 1920 } },
                audio: false
            };
            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = videoStream;
            } catch (error) {
                alert("Izinkan akses kamera di browser Anda.");
            }
        }

        function tukarKamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            mulaiKamera();
        }

        function updateUploadIndicator() {
            if (pendingUploads > 0) {
                uploadIndicator.style.display = 'block';
                pendingCountDisplay.innerText = pendingUploads;
            } else {
                uploadIndicator.style.display = 'none';
            }
        }

        function jepretFoto() {
            if (!isDemoMode && photosTaken >= maxPhotos) {
                alert("Roll film Anda sudah habis!");
                return;
            }

            // Efek Flash
            const flash = document.getElementById('flashEffect');
            flash.classList.add('flash-active');
            setTimeout(() => { flash.classList.remove('flash-active'); }, 150);

            const videoRatio = video.videoWidth / video.videoHeight;
            const targetRatio = 3 / 4; 
            
            let drawWidth = video.videoWidth;
            let drawHeight = video.videoHeight;
            let offsetX = 0;
            let offsetY = 0;

            if (videoRatio > targetRatio) {
                drawWidth = video.videoHeight * targetRatio;
                offsetX = (video.videoWidth - drawWidth) / 2;
            } else {
                drawHeight = video.videoWidth / targetRatio;
                offsetY = (video.videoHeight - drawHeight) / 2;
            }

            canvas.width = 1080;
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight, 0, 0, canvas.width, canvas.height);

            const dataURL = canvas.toDataURL('image/jpeg', 0.85);

            // Tampilkan Thumbnail secara instan
            const thumbImg = document.createElement('img');
            thumbImg.className = 'thumbnail-btn';
            thumbImg.src = dataURL;
            thumbImg.onclick = () => bukaPreview(dataURL);
            thumbnailGallery.appendChild(thumbImg);

            if (!isDemoMode) {
                photosTaken++;
                localStorage.setItem(`lastcall_${eventId}_count`, photosTaken);
                perbaruiTampilanRoll();
                
                // Panggil upload tanpa memblokir tombol
                unggahKeServerDiLatarBelakang(dataURL);
            }
        }

        function bukaPreview(dataURL) {
            currentPhotoDataUrl = dataURL;
            document.getElementById('previewImage').src = dataURL;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function tutupPreview() {
            document.getElementById('previewModal').style.display = 'none';
            currentPhotoDataUrl = null;
        }

        function simpanFotoManual() {
            if (!currentPhotoDataUrl) return;
            const a = document.createElement('a');
            a.href = currentPhotoDataUrl;
            a.download = `TheLastCall_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            tutupPreview();
        }

        // PENGUNGGAHAN LATAR BELAKANG (TANPA JEDA)
        async function unggahKeServerDiLatarBelakang(dataURL) {
            pendingUploads++;
            updateUploadIndicator();

            try {
                const IMGBB_API_KEY = "16a4714fa54ed030ef5416ae07a05f68"; 

                const base64Data = dataURL.split(',')[1];
                const formData = new FormData();
                formData.append('image', base64Data);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.success && result.data && result.data.url) {
                    const downloadURL = result.data.url;
                    
                    await db.collection('events').doc(eventId).collection('photos').add({
                        url: downloadURL,
                        uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    throw new Error("Gagal diunggah ke ImgBB.");
                }

            } catch (error) {
                console.error("Error Upload Latar Belakang:", error);
                
                // Jika gagal, kembalikan 1 kuota
                photosTaken--;
                localStorage.setItem(`lastcall_${eventId}_count`, photosTaken);
                perbaruiTampilanRoll();
            } finally {
                pendingUploads--;
                updateUploadIndicator();
                
                // Pastikan tombol bisa digunakan jika kuota masih ada
                if(photosTaken < maxPhotos) {
                    btnCapture.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
